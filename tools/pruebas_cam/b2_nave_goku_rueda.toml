# Luna 13: detenerse en la rueda 1P de la nave de Babidi, antes de elegir personaje.
# Esperar el log de la pantalla modo y su animación de entrada antes de confirmar; "nave: entrar"
# se emite unos cuadros antes, y una A inmediata se pierde en algunas velocidades de carga.
descripcion = "Nave de Babidi: Goku en la rueda de selección 1P"
env = ["DBZ3_TEST_MISIONES=5,reset", "DBZ3_TEST_NAVE_TIEMPO=6", "DBZ3_TEST_NAVE_TODO=1", "DBZ3_PS2_GAMES=D:\\DBZ3HD\\ps2_games"]
pasos = [
  'log "nave: entrar" 120',
  'log "nave: pantalla modo" 30',
  "esperar 3500",
  "captura a_nave",
  "tecla Space 900",
  "tecla W 300",
  "tecla W 300",
  "tecla W 300",
  "tecla S 300",
  "tecla S 300",
  'log "nave: pantalla planta" 30',
  "tecla Space 1500",
  'log "nave: pantalla rueda 1P" 30',
  "esperar 1200",
  "captura rueda_goku",
]
