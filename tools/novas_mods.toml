nombre_de = "HD-Texturpaket (PV) V1"
nombre_fr = "Pack de textures HD (PV) V1"
descripcion_it = "Prima versione del pack HD di SSGPrinceVegeta: circa 5300 texture del gioco a x4 (alcune a x8). Installandola si mette da parte la V2. Si attiva e disattiva con F1 > Pack HD di texture."
descripcion_de = "Erste Version des HD-Pakets von SSGPrinceVegeta: rund 5300 Spieltexturen in x4 (einige in x8). Beim Installieren wird V2 beiseitegelegt. Mit F1 > HD-Texturpaket ein- und ausschalten."
descripcion_fr = "Premiere version du pack HD de SSGPrinceVegeta : environ 5300 textures du jeu en x4 (quelques-unes en x8). L'installer met la V2 de cote. S'active et se desactive avec F1 > Pack de textures HD."

