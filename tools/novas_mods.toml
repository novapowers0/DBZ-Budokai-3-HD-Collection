# Nova's Mods: lo que publica tools/novas_mods.py en el repo privado (y descarga el launcher).
# Subir "version" vuelve a ofrecer "Actualizar" a quien lo tenga instalado.
# Textos: nombre_<idioma> / descripcion_<idioma> (es, en, it, de, fr; si falta uno, el ingles).
# autor / enlaces = ["https://..."]: credito con botones clicables en la ficha del launcher.
# release = "<tag>": zip grande (> 100 MB) partido en assets de esa release (ver tools/novas_mods.py).

[[mod]]
id = "texturas_hd_pv"
version = "1.0"       # V1: la publicada el 14/10 (su zip lleva manifest 2.0; "1.0" no pide bajar de version)
congelado = true      # no se reempaqueta: se quedan su zip y sus trozos de la release texturas-hd-pv-2.0
tipo = "texturas"
release = "texturas-hd-pv-2.0"
excluye = ["texturas_hd_pv_v2"]
autor = "SSGPrinceVegeta"
enlaces = ["https://x.com/SSGPrinceVegeta", "https://linktr.ee/ssgprincevegeta"]
nombre_es = "Pack de texturas HD (PV) V1"
nombre_en = "HD Texture Pack (PV) V1"
descripcion_es = "Primera version del pack HD de SSGPrinceVegeta: unas 5300 texturas del juego a x4 (algunas a x8). Al instalarla se aparta la V2. Se enciende y apaga con F1 > Pack HD de texturas."
descripcion_en = "First version of SSGPrinceVegeta's HD pack: about 5300 game textures at x4 (a few at x8). Installing it moves V2 aside. Turn it on and off with F1 > HD texture pack."
nombre_it = "Pack di texture HD (PV) V1"
nombre_de = "HD-Texturpaket (PV) V1"
nombre_fr = "Pack de textures HD (PV) V1"
descripcion_it = "Prima versione del pack HD di SSGPrinceVegeta: circa 5300 texture del gioco a x4 (alcune a x8). Installandola si mette da parte la V2. Si attiva e disattiva con F1 > Pack HD di texture."
descripcion_de = "Erste Version des HD-Pakets von SSGPrinceVegeta: rund 5300 Spieltexturen in x4 (einige in x8). Beim Installieren wird V2 beiseitegelegt. Mit F1 > HD-Texturpaket ein- und ausschalten."
descripcion_fr = "Premiere version du pack HD de SSGPrinceVegeta : environ 5300 textures du jeu en x4 (quelques-unes en x8). L'installer met la V2 de cote. S'active et se desactive avec F1 > Pack de textures HD."

