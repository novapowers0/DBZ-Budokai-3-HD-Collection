# HEROE-REC R2/R4 (12/11): partida guiada del Heroe, UNA saga por ring out (como smoke_c_v05_resultado; el cierre de la saga reabre la intro del Universo Dragon, asi que cada saga siguiente es otro lanzamiento sobre la MISMA ficha) con
