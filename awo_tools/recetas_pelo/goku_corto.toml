# Peinado original "Goku corto" (estilo B3: pinchos de seccion triangular + casquete). Marco: HEAD de Goku (264).
# Angulos en grados sobre el craneo: az 0 = frente (+Z), 90 = +X, 180 = atras. el 0 = ecuador, 90 = coronilla.
# largo y ancho en unidades del modelo (craneo de Goku: radio 1,15). curva: desvio final de la direccion, en fracciones del largo, hacia `hacia`.
nombre = "goku_corto"
segmentos = 3          # anillos por pincho (baja solo si no cabe en el tope de ventanas)

[craneo]
centro = [0.0, 0.5, 0.35]
radio = [1.15, 1.02, 1.05]

[casquete]               # masa de pelo que cubre el craneo (cascara abierta por abajo)
escala = 1.07
frente_el = 48           # linea del nacimiento del pelo: elevacion al frente
lados_el = 18
atras_el = 4
anillos = 4
cortes = 16

[[mechon]]
