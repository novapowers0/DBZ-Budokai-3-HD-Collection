# Dragon Rogue (ROG-05): los 7 caminos como datos. Lo lee src/rogue_caminos.cpp (dbz3::datos, F5 recarga; una partida
# en curso guarda su camino al empezar). Diseno: studies 5/ENTREGAS/ROGUE_DISENO.md 2. Un camino = una fila; un solo motor.
#   nombre/en/fr/de/it y t_es..t_it = nombre y descripcion (sin un idioma, el ingles)
#   clasico   = tipo del modo antiguo en hub_modos.toml; su [[marca]] se ensena como "Record clasico" (solo se lee)
#   combates  = 0 sin fin (50 pisos); cada_jefe = combates entre jefes (0 = ninguno, 1 = todos son jefes)
#   vida      = "llena" (cada combate) o "arrastra"; cura = vida que recuperas al ganar si arrastra; cura_jefe = al
#               ganar a un jefe (9999 = toda)
#   rivales   = "semilla" (al azar), "escalera" (la lista `escalera`, en orden), "jefes" (la lista `escalera` con las reglas
#               de los jefes del Kumite de jefes), "elo" (cuadro por la fuerza del Ranking: semifinal y final)
#   vida0/vida_paso = vida del rival del combate 1 y lo que sube por combate (los jefes, la suya)
#   tiempo/regen = cada 3 combates, uno a tiempo y otro con rival que se regenera (las oleadas de Supervivencia)
#   pausa     = "cartas" (elige 1 de 3) o "simulacion" (entrenar / explorar / descansar)
#   maldicion = "semana": la regla de la torre de la semana ([maldiciones], rota cada lunes UTC) en todos los combates
#   reglas_tramo = ids de [maldiciones]: cada tramo de 5 combates (el 2.o en adelante) suma la regla de una, en ciclo (r23)
#   premio    = Zenie extra al completar el camino. Regla del diseno 1.6: el premio del modo clasico equivalente (Torre 800 y
#               Kumite 1200 de MODOS-02; Torres 600, Torneo de 4 600, Simulacion 500, Supervivencia 1000, Abyss 800)
#   abierto   = 1 disponible de salida; si no, se abre con `abre` pisos de record en cualquier camino de Rogue
