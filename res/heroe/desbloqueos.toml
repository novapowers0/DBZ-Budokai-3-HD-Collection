# Super Saiyan (25/10, raza Saiyan, en orden): tipo "ssj" + nivel. Se despierta al vencer en Dragon Universe a quien lo
# provoco en la historia: Freezer (SSJ), Cell (SSJ2) y Kid Bu (SSJ3). Da la capsula de transformacion del estilo en cada
# combate (heroe.cpp Reglas); el modelo de cada forma (cara SSJ y el pelo SSJ de su peinado) lo monta vista_heroe.py.
[[desbloqueo]]
id = "ssj1"
tipo = "ssj"
nivel = 1
vence = 27
