# Desbloqueos del Heroe con los maestros (C3): maestro -> condicion -> desbloqueo. Por datos: se evalua en cada victoria del
# mapa de Dragon Universe y vale para cualquier combinacion de heroe/maestro. Los consigue la ficha (cac.toml `desbloqueos`).
#   maestro  ID del luchador-maestro (0 Goku, 7 Vegeta, 11 Piccolo, 10 Krillin, 27 Freezer, 33 Cell, 40 Broly*)
#   entreno  % minimo con ese maestro (o maestro ya entrenado del todo)
#   vence / forma   (opcional) ganar un combate contra ese rival (y esa forma: 0 normal 1 Kaioken 2 SSJ 3 SSJ2 4 SSJ3 5 SSJ4)
#   tipo     aura | ki | tecnica (cartas del inventario con el estilo nativo; la variante usa colores.py: aura_color / ki_color)
#   color    "#RRGGBB"      capsula  (tecnica con variante de color) numero de capsula del juego (#SKC)
# * Broly aun no es maestro (kEstilos de heroe.cpp: 6): su entrada espera a que lo sea.
version = 1

[[desbloqueo]]
id = "ki_dorado_goku"
tipo = "ki"
color = "#F0C020"
maestro = 0
entreno = 20
nombre_es = "Ki dorado (maestro Goku)"
nombre_en = "Golden ki (master Goku)"

[[desbloqueo]]
id = "kamehameha_rojo"
tipo = "tecnica"
capsula = 6
color = "#E02020"
maestro = 0
entreno = 60
vence = 0
forma = 5
nombre_es = "Kamehameha rojo (Goku al 60 % y vencer a su SSJ4)"
nombre_en = "Red Kamehameha (Goku 60% and beat his SSJ4)"

