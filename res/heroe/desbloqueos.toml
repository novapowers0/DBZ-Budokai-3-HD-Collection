# ---------------------------------------------------------------------------------------------------------------------
# Evolucion por raza (DISENO 7.1, maqueta 12; solo con el ajuste dbz3_heroe_evolucion, apagado de serie). tipo "forma":
#   raza    0 Saiyan, 1 Humano, 2 Namekiano, 3 Raza de Freezer, 4 Majin, 5 Androide (orden de las pestanas de Evolucion)
#   rama    "" tronco comun, "A" / "B": el camino que la abre (camino_es/en = su nombre en la pantalla)
#   previa  id de la forma anterior de la cadena ("" = sale de la forma base)
#   marca   marca de ruta que abre el camino ("" = ninguna). HOY SON MARCAS DE PRUEBA (DBZ3_TEST_HEROE_MARCAS="a,b"):
#           heroe-rutas las pondra de verdad en `marcas` de la ficha (enganche: heroe.cpp Marcas()).
#   vence / abre_con   condicion: ganar a ese rival, o tener ya ese desbloqueo (ssj1..3); sin ninguna, se abre sola.
#   cara    luchador cuya cabeza nativa se ve en el nodo;  capsula  capsula de transformacion que da (op 51);  cond_es/en  texto.
# Los textos de condicion y los rivales son propuestas [H] de DISENO 7.1. La regla esta en src/heroe_formas.h (con test).
# ---------------------------------------------------------------------------------------------------------------------

