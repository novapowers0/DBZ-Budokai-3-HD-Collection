it = "La solita sfida (o quella scelta con il Kit). Se l'hai lasciata a metà, riprendi da lì."

["Three days before a great battle: train, explore or rest. Each choice uses a day. On the fourth day the boss arrives."]
pt = "Três dias antes de uma grande luta: treine, explore ou descanse. Cada escolha gasta um dia. No quarto dia chega o chefe."
ja = "大きな戦いの3日前。修行・探索・休息から選択。選ぶたびに1日が過ぎる。4日目にボスが現れる。"
fr = "Trois jours avant un grand combat : entraîne-toi, explore ou repose-toi. Chaque choix coûte un jour. Le quatrième jour, le boss arrive."
de = "Drei Tage vor einem großen Kampf: trainiere, erkunde oder ruh dich aus. Jede Wahl kostet einen Tag. Am vierten Tag kommt der Boss."
it = "Tre giorni prima di un grande scontro: allenati, esplora o riposa. Ogni scelta costa un giorno. Il quarto giorno arriva il boss."

["Five fights in a row with the same health. Each win gives Zenie (more without taking damage) for the shop: heals and boosts for the next fight."]
pt = "Cinco lutas seguidas com a mesma vida. Cada vitória dá Zenie (mais se não levar dano) para a loja: curas e melhorias para a próxima luta."
ja = "同じ体力で5連戦。勝利ごとにZenieが手に入る（ダメージを受けなければ多く）。ショップで回復や強化ができる。"
fr = "Cinq combats d'affilée avec la même vie. Chaque victoire rapporte des Zenie (plus sans être touché) pour la boutique : soins et bonus pour le combat suivant."
de = "Fünf Kämpfe am Stück mit demselben Leben. Jeder Sieg bringt Zenie (mehr ohne Treffer) für den Laden: Heilung und Boosts für den nächsten Kampf."
it = "Cinque incontri di fila con la stessa vita. Ogni vittoria dà Zenie (di più senza subire danni) per il negozio: cure e potenziamenti per l'incontro successivo."

["Three-fight towers with a time limit and a special rule. The weekly one changes every Monday."]
pt = "Torres de três lutas com tempo limite e uma regra especial. A da semana muda toda segunda-feira."
ja = "制限時間と特別ルールのある3連戦の塔。今週のルールは毎週月曜に変わる。"
fr = "Tours de trois combats avec limite de temps et une règle spéciale. Celle de la semaine change chaque lundi."
de = "Türme mit drei Kämpfen, Zeitlimit und einer Sonderregel. Der Wochenturm wechselt jeden Montag."
it = "Torri di tre incontri con limite di tempo e una regola speciale. Quella della settimana cambia ogni lunedì."

["Go down three floors. After each win you pick one of three upgrade cards, for this run only. If you fall, it's over."]
pt = "Desça três andares. Após cada vitória, escolha uma de três cartas de melhoria, válidas só nesta partida. Se cair, acabou."
ja = "3階層を降りる。勝つごとに強化カード3枚から1枚を選択（今回限り）。敗北すると終了。"
fr = "Descends trois étages. Après chaque victoire, choisis une carte d'amélioration parmi trois, pour cette partie seulement. Si tu tombes, c'est fini."
de = "Steige drei Etagen hinab. Nach jedem Sieg wählst du eine von drei Verbesserungskarten, nur für diesen Lauf. Wenn du fällst, ist es vorbei."
it = "Scendi tre piani. Dopo ogni vittoria scegli una di tre carte potenziamento, solo per questa partita. Se cadi, è finita."

["Three armored bosses that hit hard. Their armor drops for 3 seconds now and then: use it! Against the last one, survive."]
pt = "Três chefes com armadura e golpes fortes. A armadura deles cai por 3 segundos de vez em quando: aproveite! Contra o último, resista."
ja = "装甲を持つ強力なボス3体。装甲は時々3秒間外れる：そのチャンスを活かせ！最後の相手は耐え抜け。"
fr = "Trois boss blindés qui frappent fort. Leur armure tombe 3 secondes de temps en temps : profites-en ! Contre le dernier, tiens bon."
de = "Drei gepanzerte Bosse, die hart zuschlagen. Ihre Panzerung fällt ab und zu für 3 Sekunden: nutze es! Gegen den letzten musst du durchhalten."
it = "Tre boss corazzati che colpiscono duro. La loro armatura cade per 3 secondi ogni tanto: sfruttalo! Contro l'ultimo, resisti."

["A hundred missions on 20 pages, one per saga: battle, time attack, survive, a special rule and Tag Team or survival. S/A/B/C rank by the health you have left. Clear 3 missions to open the next page."]
pt = "Cem missões em 20 páginas, uma por saga: luta, contra o tempo, resistir, uma regra especial e Tag Team ou sobrevivência. Rank S/A/B/C conforme a vida que restar. Com 3 missões concluídas, a página seguinte se abre."
ja = "20ページ・100のミッション（サーガごとに1つ）：バトル、タイムアタック、耐久、特別ルール、Tag Teamかサバイバル。残りの体力でS／A／B／Cランク。3ミッションクリアで次のページが開く。"
fr = "Cent missions sur 20 pages, une par saga : combat, contre la montre, tenir, une règle spéciale et Tag Team ou survie. Rang S/A/B/C selon la vie restante. Réussis 3 missions pour ouvrir la page suivante."
de = "Hundert Missionen auf 20 Seiten, eine pro Saga: Kampf, Zeitangriff, Durchhalten, eine Sonderregel und Tag Team oder Überleben. Rang S/A/B/C nach dem verbleibenden Leben. 3 geschaffte Missionen öffnen die nächste Seite."
it = "Cento missioni in 20 pagine, una per saga: scontro, contro il tempo, resistere, una regola speciale e Tag Team o sopravvivenza. Grado S/A/B/C in base alla vita rimasta. Supera 3 missioni per aprire la pagina dopo."

["A four-fighter tournament against three CPU rivals: semifinal and final. The other match is decided by each fighter's strength."]
pt = "Um torneio de quatro com três rivais da máquina: semifinal e final. A outra luta é decidida pela força de cada lutador."
ja = "CPU相手の4人トーナメント3戦：準決勝と決勝。もう一方の試合は各ファイターの強さで決まる。"
fr = "Un tournoi à quatre contre trois adversaires de la console : demi-finale et finale. L'autre combat se décide selon la force de chaque combattant."
de = "Ein Turnier zu viert gegen drei CPU-Gegner: Halbfinale und Finale. Der andere Kampf wird nach der Stärke der Kämpfer entschieden."
it = "Un torneo a quattro contro tre avversari della CPU: semifinale e finale. L'altro incontro si decide in base alla forza di ogni lottatore."

