["Draws below the internal resolution and the upscaler brings it back: more FPS with a slightly softer picture. Only whole scales exist: at 2x only Performance goes lower (to 1x); at 3x Quality renders at 2x. At 1x nothing changes."]
fr = "Dessine en dessous de la résolution interne et l'upscaler la rétablit : plus de FPS, avec une image un peu plus douce. Seules les échelles entières existent : à 2x, seul Rendement descend (à 1x) ; à 3x, Qualité dessine en 2x. À 1x, rien ne change."
de = "Zeichnet unterhalb der internen Auflösung und der Upscaler stellt sie wieder her: mehr FPS bei etwas weicherem Bild. Es gibt nur ganze Stufen: Bei 2x geht nur Leistung tiefer (auf 1x); bei 3x rendert Qualität mit 2x. Bei 1x ändert sich nichts."
it = "Disegna sotto la risoluzione interna e l'upscaler la riporta su: più FPS con un'immagine un po' più morbida. Esistono solo scale intere: a 2x solo Prestazioni scende (a 1x); a 3x Qualità disegna a 2x. A 1x non cambia nulla."
pt = "Desenha abaixo da resolução interna e o upscaler a reconstrói: mais FPS com imagem um pouco mais suave. Só existem escalas inteiras: em 2x, apenas Performance cai mais (para 1x); em 3x, Quality renderiza em 2x. Em 1x nada muda."
ja = "内部解像度より低く描画し、アップスケーラーで元に戻す。FPSは上がるが画面はやや柔らかくなる。整数倍のスケールのみ：2倍ではPerformanceだけがさらに下がる（1倍まで）。3倍ではQualityが2倍で描画する。1倍では変化なし。"

