["That is the HD Collection MENU (the disc's root default.xex), not Budokai 3. Copy Budokai 3's executable (inside the DBZ3/ folder, named yae3_xenon.xex) next to dbz3.exe, or pick the disc's .iso below: the launcher extracts the executable from the disc by itself."]
fr = "C'est le MENU de la HD Collection (le default.xex à la racine du disque), pas Budokai 3. Copie l'exécutable de Budokai 3 (dans le dossier DBZ3/, nommé yae3_xenon.xex) à côté de dbz3.exe, ou choisis l'ISO du disque ci-dessous : le launcher extrait l'exécutable tout seul."
de = "Das ist das MENÜ der HD Collection (die default.xex im Hauptverzeichnis der Disc), nicht Budokai 3. Kopiere die Programmdatei von Budokai 3 (im Ordner DBZ3/, namens yae3_xenon.xex) neben dbz3.exe oder wähle unten das ISO der Disc: Der Launcher holt die Programmdatei selbst heraus."
it = "Questo è il MENU della HD Collection (il default.xex nella radice del disco), non Budokai 3. Copia l'eseguibile di Budokai 3 (nella cartella DBZ3/, chiamato yae3_xenon.xex) accanto a dbz3.exe, oppure scegli qui sotto l'ISO del disco: il launcher estrae l'eseguibile da solo."
pt = "Esse é o MENU da HD Collection (o default.xex da raiz do disco), não o Budokai 3. Copie o executável do Budokai 3 (dentro da pasta DBZ3/, chamado yae3_xenon.xex) ao lado de dbz3.exe, ou escolha abaixo o .iso do disco: o launcher extrai o executável do disco sozinho."
ja = "これはHD Collectionのメニュー（ディスクのルートにある default.xex）で、Budokai 3ではありません。Budokai 3の実行ファイル（DBZ3/フォルダー内の yae3_xenon.xex）を dbz3.exe の隣にコピーするか、下でディスクの .iso を選んでください。ランチャーがディスクから実行ファイルを自動で取り出します。"

["This is the EU/PAL core and default.xex is the US/NA executable. Each core is a recompilation of ONE executable: this one only boots the EU/PAL one (yae3_xenon_eu.xex). Replace default.xex with the EU/PAL one, or use the main launcher (which picks the correct core automatically)."]
fr = "C'est le cœur EU/PAL, et default.xex est l'exécutable US/NA. Chaque cœur est une recompilation d'UN exécutable : celui-ci ne lance que l'exécutable EU/PAL (yae3_xenon_eu.xex). Remplace default.xex par l'EU/PAL, ou utilise le launcher principal (qui choisit automatiquement le bon cœur)."
de = "Das ist der EU/PAL-Kern, default.xex ist aber die US/NA-Programmdatei. Jeder Kern ist eine Neukompilierung EINER Programmdatei: Dieser startet nur die EU/PAL-Datei (yae3_xenon_eu.xex). Ersetze default.xex durch die EU/PAL-Datei oder nutze den Haupt-Launcher (der den richtigen Kern automatisch wählt)."
it = "Questo è il core EU/PAL, ma default.xex è l'eseguibile US/NA. Ogni core è una ricompilazione di UN eseguibile: questo avvia solo quello EU/PAL (yae3_xenon_eu.xex). Sostituisci default.xex con quello EU/PAL, oppure usa il launcher principale (che sceglie automaticamente il core giusto)."
pt = "Este é o núcleo EU/PAL e o default.xex é o executável US/NA. Cada núcleo é uma recompilação de UM executável: este só inicia o EU/PAL (yae3_xenon_eu.xex). Substitua o default.xex pelo EU/PAL, ou use o launcher principal (que escolhe o núcleo correto sozinho)."
ja = "これはEU/PALのコアで、default.xex はUS/NAの実行ファイルです。各コアは1つの実行ファイルを再コンパイルしたもので、これはEU/PAL（yae3_xenon_eu.xex）のみ起動します。default.xex をEU/PAL版に差し替えるか、メインのランチャー（正しいコアを自動で選びます）を使ってください。"

["default.xex is the EU/PAL executable. This core is recompiled ONLY from the US/NA executable (yae3_xenon.xex): the EU one cannot boot here (the game closes at startup). Replace default.xex with the US/NA one, or use the main launcher (which picks the EU/PAL core automatically). The EU/PAL region and language are chosen here."]
fr = "default.xex est l'exécutable EU/PAL. Ce cœur est recompilé UNIQUEMENT à partir de l'exécutable US/NA (yae3_xenon.xex) : celui de l'EU ne peut pas démarrer ici (le jeu se ferme au lancement). Remplace default.xex par celui US/NA, ou utilise le launcher principal (qui choisit automatiquement le cœur EU/PAL). La région et la langue EU/PAL se choisissent ici."
de = "default.xex ist die EU/PAL-Programmdatei. Dieser Kern wird NUR aus der US/NA-Programmdatei (yae3_xenon.xex) neu kompiliert: Die EU-Datei kann hier nicht starten (das Spiel schließt sich beim Start). Ersetze default.xex durch die US/NA-Datei oder nutze den Haupt-Launcher (der automatisch den EU/PAL-Kern wählt). Region und Sprache EU/PAL werden hier gewählt."
it = "default.xex è l'eseguibile EU/PAL. Questo core è ricompilato SOLO dall'eseguibile US/NA (yae3_xenon.xex): quello EU non può avviarsi qui (il gioco si chiude all'avvio). Sostituisci default.xex con quello US/NA, oppure usa il launcher principale (che sceglie automaticamente il core EU/PAL). Regione e lingua EU/PAL si scelgono qui."
pt = "O default.xex é o executável EU/PAL. Este núcleo foi recompilado SOMENTE a partir do executável US/NA (yae3_xenon.xex): a versão EU não pode iniciar aqui (o jogo fecha na inicialização). Substitua o default.xex pelo US/NA, ou use o launcher principal (que escolhe o núcleo EU/PAL sozinho). A região EU/PAL e o idioma são escolhidos aqui."
ja = "default.xex はEU/PALの実行ファイルです。このコアはUS/NAの実行ファイル（yae3_xenon.xex）からのみ再コンパイルされているため、EU版はここでは起動できません（起動時に終了します）。default.xex をUS/NA版に差し替えるか、メインのランチャー（EU/PALコアを自動で選びます）を使ってください。リージョンEU/PALと言語はここで選びます。"

