# tPERF: en pantallas de mas de 4K la escala nativa real (4x/6x) no da 60 FPS; se propone 3x.
["Use %dx (recommended for this screen)"]
es = "Usar escala %dx (recomendada para esta pantalla)"
en = "Use %dx (recommended for this screen)"
fr = "Utiliser l'échelle %dx (recommandée pour cet écran)"
de = "%dx verwenden (für diesen Bildschirm empfohlen)"
it = "Usa scala %dx (consigliata per questo schermo)"
pt = "Usar escala %dx (recomendada para esta tela)"
ja = "この画面に推奨の %dx を使用"

["On this screen, 3x is the most that keeps 60 FPS: the presenter scales the rest without losing sharpness. 4x drops to ~50 FPS and 6x to ~18 FPS."]
es = "En esta pantalla, 3x es lo maximo que mantiene 60 FPS: el resto lo escala el presentador sin perder nitidez. 4x baja a ~50 FPS y 6x a ~18 FPS."
en = "On this screen, 3x is the most that keeps 60 FPS: the presenter scales the rest without losing sharpness. 4x drops to ~50 FPS and 6x to ~18 FPS."
fr = "Sur cet écran, 3x est le maximum qui maintient 60 FPS : le reste est mis à l'échelle par le présentateur sans perte de netteté. 4x descend à ~50 FPS et 6x à ~18 FPS."
de = "Auf diesem Bildschirm sind 3x das Maximum, das 60 FPS hält: den Rest skaliert der Presenter ohne Schärfeverlust. 4x fällt auf ~50 FPS und 6x auf ~18 FPS."
it = "Su questo schermo, 3x è il massimo che mantiene 60 FPS: il resto lo scala il presentatore senza perdere nitidezza. 4x scende a ~50 FPS e 6x a ~18 FPS."
pt = "Nesta tela, 3x é o máximo que mantém 60 FPS: o restante é escalado pelo apresentador sem perder nitidez. 4x cai para ~50 FPS e 6x para ~18 FPS."
ja = "この画面では 60 FPS を維持できるのは最大 3x です。残りはプレゼンターが拡大しても鮮明さを失いません。4x は約50FPS、6x は約18FPS まで低下します。"

["The native scale draws at your screen's real resolution: it looks sharp and is the cheapest option for it. Above that it is supersampling (expensive antialiasing)."]
es = "La escala nativa dibuja a la resolucion real de tu pantalla: se ve nitido y es lo mas barato para esa resolucion. Mas arriba es supersampling (antialiasing caro)."
fr = "L'échelle native dessine à la résolution réelle de votre écran : l'image est nette et c'est l'option la moins coûteuse. Au-delà, c'est du supersampling (anticrénelage coûteux)."
de = "Die native Skalierung rendert in der echten Bildschirmauflösung: scharf und die günstigste Option dafür. Darüber ist es Supersampling (teures Antialiasing)."
it = "La scala nativa disegna alla risoluzione reale dello schermo: è nitida ed è l'opzione più economica. Oltre è supersampling (antialiasing costoso)."
pt = "A escala nativa desenha na resolução real da tela: fica nítido e é a opção mais barata. Acima disso é supersampling (antialiasing caro)."
ja = "ネイティブスケールは画面の実際の解像度で描画するため、鮮明で最も低コストです。それ以上はスーパーサンプリング（高コストのアンチエイリアス）です。"

["VRAM: about %d MB estimated with this scale and resolution; your GPU has %d MB. If it does not fit, the game warns in the log and may lower the scale or the upscaling effect."]
es = "VRAM: se estiman ~%d MB con esta escala y resolucion; tu GPU tiene %d MB. Si no cabe, el juego lo avisa en el registro y puede bajar la escala o el efecto de escalado."
fr = "VRAM : environ %d Mo estimés avec cette échelle et cette résolution ; votre GPU dispose de %d Mo. Si cela ne tient pas, le jeu l'indique dans le journal et peut réduire l'échelle ou l'effet d'agrandissement."
de = "VRAM: mit dieser Skalierung und Auflösung werden ca. %d MB geschätzt; Ihre GPU hat %d MB. Wenn es nicht passt, meldet das Spiel es im Protokoll und senkt ggf. die Skalierung oder den Upscaling-Effekt."
it = "VRAM: stimati circa %d MB con questa scala e risoluzione; la GPU ha %d MB. Se non basta, il gioco lo segnala nel registro e può ridurre la scala o l'effetto di upscaling."
pt = "VRAM: estimados ~%d MB com esta escala e resolução; sua GPU tem %d MB. Se não couber, o jogo avisa no registro e pode reduzir a escala ou o efeito de upscaling."
ja = "VRAM: このスケールと解像度で約 %d MB と推定されます（GPU は %d MB）。収まらない場合、ゲームはログで通知し、スケールまたはアップスケーリング効果を下げることがあります。"

["4x and 6x lower the frame rate even on good GPUs: measured in a battle, 4x ~50 FPS and 6x ~18 FPS on an RTX 4070 SUPER."]
es = "4x y 6x bajan los FPS incluso en GPUs buenas: medido en un combate, 4x ~50 FPS y 6x ~18 FPS en una RTX 4070 SUPER."
fr = "4x et 6x réduisent les FPS même sur de bonnes GPU : mesuré en combat, 4x ~50 FPS et 6x ~18 FPS sur une RTX 4070 SUPER."
de = "4x und 6x senken die Bildrate selbst auf guten GPUs: im Kampf gemessen, 4x ~50 FPS und 6x ~18 FPS auf einer RTX 4070 SUPER."
it = "4x e 6x riducono gli FPS anche su GPU buone: misurato in combattimento, 4x ~50 FPS e 6x ~18 FPS su una RTX 4070 SUPER."
pt = "4x e 6x reduzem os FPS mesmo em GPUs boas: medido em combate, 4x ~50 FPS e 6x ~18 FPS numa RTX 4070 SUPER."
ja = "4x と 6x は高性能GPUでもFPSが下がります（戦闘で計測: RTX 4070 SUPER で 4x 約50FPS、6x 約18FPS）。"

