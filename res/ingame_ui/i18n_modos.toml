it = "Scrive ogni texture unica come DDS + index.jsonl per creare pacchetti texture (stile PCSX2). Può occupare centinaia di MB: scegli una cartella con spazio. Solo per sviluppo; richiede un riavvio e non ha effetto finché il miglioramento texture HD è attivo."
