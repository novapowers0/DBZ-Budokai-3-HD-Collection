fr = "ATTENTION : charge les DLL du dossier plugins à côté de dbz3.exe (ex. : le mod d'accessibilité pour les joueurs aveugles). Ce code tiers a les mêmes accès que le jeu : n'active que des plugins de confiance. S'applique au redémarrage du jeu ; les plugins chargés sont indiqués dans le journal."
