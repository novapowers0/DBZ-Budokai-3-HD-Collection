["To find an opponent, your room code is posted on a free service (ntfy.sh). That code includes your internet address (IP), and anyone reading it can see it. Only that, the game version and a summary of your mods are sent. If you would rather not, play with a friend using a code."]
es = "Para encontrar rival, tu codigo de sala se publica en un servicio gratuito (ntfy.sh). Ese codigo incluye tu direccion de internet (IP), y cualquiera que lo lea puede verla. Solo se envia eso, la version del juego y un resumen de tus mods. Si prefieres que no, juega con un amigo usando un codigo."
en = "To find an opponent, your room code is posted on a free service (ntfy.sh). That code includes your internet address (IP), and anyone reading it can see it. Only that, the game version and a summary of your mods are sent. If you would rather not, play with a friend using a code."
fr = "Pour trouver un adversaire, votre code de salle est publié sur un service gratuit (ntfy.sh). Ce code contient votre adresse internet (IP), visible par toute personne qui le lit. Seuls ce code, la version du jeu et un résumé de vos mods sont envoyés. Sinon, jouez avec un ami en utilisant un code."
de = "Um einen Gegner zu finden, wird dein Raumcode bei einem kostenlosen Dienst (ntfy.sh) veröffentlicht. Der Code enthält deine Internetadresse (IP), die jeder sehen kann, der ihn liest. Gesendet werden nur er, die Spielversion und eine Zusammenfassung deiner Mods. Wenn du das nicht möchtest, spiele mit einem Freund per Code."
it = "Per trovare un avversario, il tuo codice stanza viene pubblicato su un servizio gratuito (ntfy.sh). Il codice contiene il tuo indirizzo internet (IP), visibile a chiunque lo legga. Vengono inviati solo il codice, la versione del gioco e un riepilogo dei tuoi mod. Se preferisci di no, gioca con un amico usando un codice."
pt = "Para encontrar um rival, seu código de sala é publicado em um serviço gratuito (ntfy.sh). Esse código inclui seu endereço de internet (IP), visível para quem o ler. Só são enviados o código, a versão do jogo e um resumo dos seus mods. Se preferir não, jogue com um amigo usando um código."
ja = "対戦相手を探すため、ルームコードを無料サービス (ntfy.sh) に公開します。コードにはインターネットアドレス (IP) が含まれ、読んだ人は誰でも見ることができます。送信されるのはコード、ゲームのバージョン、Mod の概要だけです。公開したくない場合は、コードを使って友達と遊んでください。"

