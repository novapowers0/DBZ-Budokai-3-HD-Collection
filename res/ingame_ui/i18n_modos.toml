["Break crates, barrels and jars with your techniques: they drop zeni, gems and items."]
es = "Rompe cajas, barriles y vasijas con tus técnicas: sueltan zeni, gemas y objetos."
en = "Break crates, barrels and jars with your techniques: they drop zeni, gems and items."
fr = "Brise les caisses, les tonneaux et les jarres avec tes techniques : ils donnent des zénis, des gemmes et des objets."
de = "Zerstöre Kisten, Fässer und Krüge mit deinen Techniken: Sie lassen Zeni, Edelsteine und Gegenstände fallen."
it = "Rompi casse, barili e vasi con le tue tecniche: lasciano zeni, gemme e oggetti."
pt = "Quebre caixas, barris e vasos com suas técnicas: eles deixam cair zeni, gemas e itens."
ja = "技で木箱や樽、壺を壊すと、ゼニーやジェム、アイテムが手に入る。"

["Spend your zeni in the shop (Y button when choosing a fighter): upgrades are permanent."]
es = "Gasta los zeni en la tienda (botón Y al elegir luchador): las mejoras se quedan para siempre."
en = "Spend your zeni in the shop (Y button when choosing a fighter): upgrades are permanent."
fr = "Dépense tes zénis à la boutique (touche Y à la sélection du combattant) : les améliorations sont permanentes."
de = "Gib deine Zeni im Laden aus (Y bei der Kämpferwahl): Verbesserungen bleiben dauerhaft."
it = "Spendi gli zeni nel negozio (tasto Y alla selezione del lottatore): i potenziamenti sono permanenti."
pt = "Gaste seus zeni na loja (botão Y ao escolher um lutador): as melhorias são permanentes."
ja = "ゼニーを使うには、キャラクター選択でYを押してショップへ。強化は次のプレイにも引き継がれる。"

["Win, or survive until minute 10, to unlock the next stage."]
es = "Gana, o aguanta hasta el minuto 10, para abrir el siguiente escenario."
en = "Win, or survive until minute 10, to unlock the next stage."
fr = "Gagne ou survis jusqu'à la dixième minute pour débloquer le prochain stage."
de = "Gewinne oder überlebe bis zur zehnten Minute, um die nächste Arena freizuschalten."
it = "Vinci o resisti fino al decimo minuto per sbloccare lo scenario successivo."
pt = "Vença ou sobreviva até o décimo minuto para desbloquear o próximo cenário."
ja = "勝利するか、10分間生き残ると次のステージが解放される。"

["Shadows and marks on the ground warn you of what is about to fall: move away!"]
es = "Las sombras y las marcas en el suelo avisan de lo que va a caer: ¡apártate!"
en = "Shadows and marks on the ground warn you of what is about to fall: move away!"
fr = "Les ombres et les marques au sol annoncent une chute : éloigne-toi !"
de = "Schatten und Markierungen am Boden warnen vor herabfallenden Angriffen: Weiche aus!"
it = "Le ombre e i segni a terra ti avvisano di ciò che sta per cadere: allontanati!"
pt = "Sombras e marcas no chão avisam onde algo vai cair: afaste-se!"
ja = "地面の影や印は落下の合図。すぐに離れよう！"

["Keep defeating enemies to keep your streak going: it gives a bit more experience."]
es = "Derrota enemigos sin parar para mantener la racha: da un poco más de experiencia."
en = "Keep defeating enemies to keep your streak going: it gives a bit more experience."
fr = "Enchaîne les ennemis vaincus pour garder ta série et gagner un peu plus d'expérience."
de = "Besiege weiter Gegner, um deine Serie zu halten und etwas mehr Erfahrung zu sammeln."
it = "Continua a sconfiggere nemici per mantenere la serie e ottenere un po' più di esperienza."
pt = "Continue derrotando inimigos para manter a sequência e ganhar um pouco mais de experiência."
ja = "敵を続けて倒すと連続撃破が続き、経験値が少し増える。"

["A level 5 technique plus its passive can evolve into something much stronger."]
es = "Una técnica al nivel 5 y su mejora pasiva pueden evolucionar en algo mucho más fuerte."
en = "A level 5 technique plus its passive can evolve into something much stronger."
fr = "Une technique de niveau 5 peut évoluer avec son bonus passif et devenir bien plus puissante."
de = "Eine Technik auf Stufe 5 kann sich mit ihrem passiven Bonus zu einer viel stärkeren Technik entwickeln."
it = "Una tecnica di livello 5 può evolversi con il suo bonus passivo e diventare molto più potente."
pt = "Uma técnica de nível 5 pode evoluir com sua melhoria passiva e ficar muito mais forte."
ja = "レベル5の技は、対応するパッシブ強化と組み合わせると、さらに強力な技に進化できる。"

["Refund exceeds your Zeni limit."]
es = "No cabe el reembolso. Gasta zeni primero."
en = "Refund exceeds your Zeni limit."
fr = "Le remboursement dépasse la limite de zénis."
de = "Die Erstattung überschreitet dein Zeni-Limit."
it = "Il rimborso supera il limite di zeni."
pt = "O reembolso ultrapassa o limite de zeni."
ja = "払い戻すとゼニーの上限を超える。"

