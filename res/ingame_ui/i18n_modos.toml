["To find an opponent, the game publishes your room code (it contains your IP) on a free public service (ntfy.sh), with the version and a summary of your mods. Anyone reading it can see your IP. Nothing else is sent. If you decline, you can still use a code by hand."]
es = "Para encontrar rival, el juego publica tu codigo de sala (contiene tu IP) en un servicio publico y gratuito (ntfy.sh), con la version y un resumen de tus mods. Quien lo lea podra ver tu IP. No se envia nada mas. Si no aceptas, sigues pudiendo usar el codigo a mano."
en = "To find an opponent, the game publishes your room code (it contains your IP) on a free public service (ntfy.sh), with the version and a summary of your mods. Anyone reading it can see your IP. Nothing else is sent. If you decline, you can still use a code by hand."
fr = "Pour trouver un adversaire, le jeu publie le code de ta salle (il contient ton IP) sur un service public gratuit (ntfy.sh), avec la version et un résumé de tes mods. Quiconque le lit peut voir ton IP. Rien d'autre n'est envoyé. Si tu refuses, tu peux toujours utiliser un code à la main."
de = "Um einen Gegner zu finden, veröffentlicht das Spiel deinen Raumcode (er enthält deine IP) auf einem kostenlosen öffentlichen Dienst (ntfy.sh), zusammen mit der Version und einer Zusammenfassung deiner Mods. Jeder, der ihn liest, kann deine IP sehen. Sonst wird nichts gesendet. Wenn du ablehnst, kannst du weiterhin einen Code von Hand nutzen."
it = "Per trovare un avversario, il gioco pubblica il codice della tua stanza (contiene il tuo IP) su un servizio pubblico gratuito (ntfy.sh), con la versione e un riepilogo delle tue mod. Chiunque lo legga può vedere il tuo IP. Non viene inviato altro. Se rifiuti, puoi comunque usare un codice a mano."
pt = "Para encontrar um adversário, o jogo publica o código da sua sala (ele contém seu IP) em um serviço público e gratuito (ntfy.sh), com a versão e um resumo dos seus mods. Quem ler poderá ver seu IP. Nada mais é enviado. Se recusar, você ainda pode usar o código manualmente."
ja = "対戦相手を探すため、ルームコード(あなたのIPを含みます)をバージョンとMODの要約と共に無料の公開サービス(ntfy.sh)に公開します。読んだ人にはあなたのIPが見えます。それ以外は送信されません。同意しない場合でも、コードを手入力して遊べます。"

