pt = "Seus mods: marque a caixa para ativar ou desmarque para desativar (é aplicado ao pressionar JOGAR). Para instalar um, arraste o .zip dele para esta janela, pressione «Instalar mod (.zip)...» ou baixe em Nova's Mods. Clique no nome de um mod para ver a ficha dele."
