pt = "Ondas seguidas: a vida que resta passa para a próxima e você recupera um pouco entre elas."
ja = "連続ウェーブ：残りの体力は次に持ち越し、その間に少し回復。"

["Bosses with lots of health, one after another. Your health carries over too."]
