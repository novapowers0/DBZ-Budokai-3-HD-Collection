it = "Ammorbidisci bordi (MSAA 2x)"
pt = "Bordas suaves (MSAA 2x)"
ja = "滑らかなエッジ（2x MSAA）"

["Smooths edges (less aliasing) at a moderate GPU cost. It helps most with the internal scale at 1x; if you raise the scale, you can turn it off without losing much quality."]
fr = "Lisse les contours (moins de crénelage) pour un coût GPU modéré. Il aide surtout avec l'échelle interne à 1x ; si tu l'augmentes, tu peux le désactiver sans perdre beaucoup de qualité."
de = "Glättet Kanten (weniger Treppeneffekt) bei moderater GPU-Last. Am meisten bringt es bei interner Skalierung 1x; wenn du die Skalierung erhöhst, kannst du es ohne großen Qualitätsverlust ausschalten."
it = "Ammorbidisce i bordi (meno effetto scalettatura) con un costo GPU moderato. Aiuta soprattutto con scala interna 1x; se alzi la scala puoi disattivarlo senza perdere molta qualità."
pt = "Suaviza as bordas (menos serrilhado) com custo moderado de GPU. Se nota mais com a escala interna em 1x; se aumentar a escala, pode desativar sem perder muita qualidade."
ja = "適度なGPU負荷でエッジを滑らかにします（ギザギザを軽減）。内部スケールが1xのときに特に効果があります。スケールを上げた場合は、画質をあまり落とさずにオフにできます。"

