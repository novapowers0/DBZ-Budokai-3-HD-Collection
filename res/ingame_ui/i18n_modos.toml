fr = "Écrit chaque texture unique en DDS + index.jsonl pour créer des packs de textures (style PCSX2). Peut prendre des centaines de Mo : choisis un dossier avec de la place. Réservé au développement ; nécessite un redémarrage et n'a aucun effet tant que l'amélioration des textures HD est activée."
