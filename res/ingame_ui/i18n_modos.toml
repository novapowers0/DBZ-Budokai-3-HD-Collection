["Training No.10 (3 times: use an item and taunt): IW uses Taunt_35 (0x35) and item activation; Budokai 3 HD has no measured taunt or battle items (its capsules are skills). Not ported."]
es = "Entrenamiento No.10 (3 veces: usar un objeto y burlarse): IW usa Taunt_35 (0x35) y la activación de objeto; B3 HD no tiene burla ni objetos de combate medidos (sus cápsulas son habilidades). Sin portar."
en = "Training No.10 (3 times: use an item and taunt): IW uses Taunt_35 (0x35) and item activation; Budokai 3 HD has no measured taunt or battle items (its capsules are skills). Not ported."
fr = "Entraînement n°10 (3 fois : utiliser un objet et se moquer) : IW utilise Taunt_35 (0x35) et l'activation d'objet ; Budokai 3 HD n'a ni moquerie ni objets de combat mesurés (ses capsules sont des compétences). Non porté."
de = "Training Nr. 10 (3-mal: einen Gegenstand benutzen und spotten): IW nutzt Taunt_35 (0x35) und die Gegenstandsaktivierung; Budokai 3 HD hat weder gemessenes Spotten noch Kampfgegenstände (seine Kapseln sind Fähigkeiten). Nicht portiert."
it = "Allenamento n. 10 (3 volte: usare un oggetto e deridere): IW usa Taunt_35 (0x35) e l'attivazione dell'oggetto; Budokai 3 HD non ha né derisione né oggetti di combattimento misurati (le sue capsule sono abilità). Non portato."
pt = "Treino n.º 10 (3 vezes: usar um objeto e provocar): o IW usa Taunt_35 (0x35) e a ativação de objeto; o Budokai 3 HD não tem provocação nem objetos de combate medidos (as suas cápsulas são habilidades). Não portado."
ja = "トレーニングNo.10（3回：アイテムを使い、挑発する）：IWはTaunt_35（0x35）とアイテム発動を使う。B3 HDには測定済みの挑発も戦闘アイテムもない（カプセルはスキル）。移植なし。"

["Training No.3 (3 times: P+K blow away and 3 pursuits): in IW the blow is the heavy attack and the pursuit its sequence; in Budokai 3 only the Dragon Rush (0x400-0x43F) is measured, not the blow-away. Not ported."]
es = "Entrenamiento No.3 (3 veces: golpe fuerte P+K que manda lejos y 3 persecuciones): en IW el golpe es el ataque fuerte y la persecución su secuencia; en B3 solo está medido el Dragon Rush (0x400-0x43F) y no se ha medido el golpe que manda lejos. Sin portar."
en = "Training No.3 (3 times: P+K blow away and 3 pursuits): in IW the blow is the heavy attack and the pursuit its sequence; in Budokai 3 only the Dragon Rush (0x400-0x43F) is measured, not the blow-away. Not ported."
fr = "Entraînement n°3 (3 fois : coup puissant P+K qui envoie au loin et 3 poursuites) : dans IW, le coup est l'attaque forte et la poursuite sa séquence ; dans B3, seul le Dragon Rush (0x400-0x43F) est mesuré, pas le coup qui envoie au loin. Non porté."
de = "Training Nr. 3 (3-mal: starker P+K-Schlag, der wegschleudert, und 3 Verfolgungen): In IW ist der Schlag der starke Angriff und die Verfolgung seine Sequenz; in B3 ist nur der Dragon Rush (0x400-0x43F) gemessen, nicht der Wegschleuder-Schlag. Nicht portiert."
it = "Allenamento n. 3 (3 volte: colpo forte P+K che allontana e 3 inseguimenti): in IW il colpo è l'attacco forte e l'inseguimento la sua sequenza; in B3 è misurato solo il Dragon Rush (0x400-0x43F), non il colpo che allontana. Non portato."
pt = "Treino n.º 3 (3 vezes: golpe forte P+K que afasta e 3 perseguições): no IW o golpe é o ataque forte e a perseguição a sua sequência; no B3 só está medido o Dragon Rush (0x400-0x43F), não o golpe que afasta. Não portado."
ja = "トレーニングNo.3（3回：相手を吹き飛ばすP+Kの強攻撃と3回の追撃）：IWでは吹き飛ばしが強攻撃、追撃がその連続技。B3ではドラゴンラッシュ（0x400-0x43F）のみ測定済みで、吹き飛ばしは未測定。移植なし。"

["Training No.5 (3 times: roll with G before landing and a directional roll): IW uses actions 0x3E-0x41; no voluntary roll has been measured in Budokai 3 HD (on landing it plays 22 → 33/0x090 → 34/0x12D → 18/19, the automatic recovery). Not ported."]
es = "Entrenamiento No.5 (3 veces: voltereta con G antes de tocar el suelo y voltereta con dirección): IW usa las acciones 0x3E-0x41; en B3 HD no se ha medido ninguna voltereta voluntaria (al caer salen 22 → 33/0x090 → 34/0x12D → 18/19, la recuperación automática). Sin portar."
en = "Training No.5 (3 times: roll with G before landing and a directional roll): IW uses actions 0x3E-0x41; no voluntary roll has been measured in Budokai 3 HD (on landing it plays 22 → 33/0x090 → 34/0x12D → 18/19, the automatic recovery). Not ported."
fr = "Entraînement n°5 (3 fois : roulade avec G avant d'atterrir et roulade directionnelle) : IW utilise les actions 0x3E-0x41 ; aucune roulade volontaire n'a été mesurée dans Budokai 3 HD (à l'atterrissage, il joue 22 → 33/0x090 → 34/0x12D → 18/19, la récupération automatique). Non porté."
de = "Training Nr. 5 (3-mal: Rolle mit G vor der Landung und eine gerichtete Rolle): IW nutzt die Aktionen 0x3E-0x41; in Budokai 3 HD wurde keine freiwillige Rolle gemessen (bei der Landung spielt es 22 → 33/0x090 → 34/0x12D → 18/19, die automatische Erholung). Nicht portiert."
it = "Allenamento n. 5 (3 volte: capriola con G prima di atterrare e capriola direzionale): IW usa le azioni 0x3E-0x41; in Budokai 3 HD non è stata misurata alcuna capriola volontaria (all'atterraggio esegue 22 → 33/0x090 → 34/0x12D → 18/19, il recupero automatico). Non portato."
pt = "Treino n.º 5 (3 vezes: cambalhota com G antes de aterrar e cambalhota direcional): o IW usa as ações 0x3E-0x41; no Budokai 3 HD não foi medida nenhuma cambalhota voluntária (ao aterrar reproduz 22 → 33/0x090 → 34/0x12D → 18/19, a recuperação automática). Não portado."
ja = "トレーニングNo.5（3回：着地前にGで転がり、方向付きで転がる）：IWはアクション0x3E-0x41を使う。B3 HDでは任意の転がりは未測定（着地時は22 → 33/0x090 → 34/0x12D → 18/19の自動回復を再生）。移植なし。"

["Training No.7 (5 attacks while dashing or flying): IW counts them with dash 0x3A-0x3D and the chained attack; no dashed or flight attack code has been measured in Budokai 3 HD. Not ported."]
es = "Entrenamiento No.7 (5 ataques en carrera o vuelo): IW los cuenta con el dash 0x3A-0x3D y el ataque encadenado; en B3 HD no se ha medido ningún código de ataque en dash o vuelo. Sin portar."
en = "Training No.7 (5 attacks while dashing or flying): IW counts them with dash 0x3A-0x3D and the chained attack; no dashed or flight attack code has been measured in Budokai 3 HD. Not ported."
fr = "Entraînement n°7 (5 attaques en course ou en vol) : IW les compte avec le dash 0x3A-0x3D et l'attaque enchaînée ; aucun code d'attaque en dash ou en vol n'a été mesuré dans Budokai 3 HD. Non porté."
de = "Training Nr. 7 (5 Angriffe beim Rennen oder Fliegen): IW zählt sie mit dem Dash 0x3A-0x3D und dem verketteten Angriff; in Budokai 3 HD wurde kein Angriffscode beim Dash oder Flug gemessen. Nicht portiert."
it = "Allenamento n. 7 (5 attacchi in corsa o in volo): IW li conta con il dash 0x3A-0x3D e l'attacco concatenato; in Budokai 3 HD non è stato misurato alcun codice di attacco in dash o volo. Non portato."
pt = "Treino n.º 7 (5 ataques em corrida ou voo): o IW conta-os com o dash 0x3A-0x3D e o ataque encadeado; no Budokai 3 HD não foi medido nenhum código de ataque em dash ou voo. Não portado."
ja = "トレーニングNo.7（5回：ダッシュ中または飛行中の攻撃）：IWではダッシュ0x3A-0x3Dと連続攻撃で数える。B3 HDではダッシュ中・飛行中の攻撃コードは未測定。移植なし。"

