["FSR upscales the internal render to the display size.\nBest paired with a low internal scale (1x) on a 1080p+ display."]
es = "FSR escala el render interno al tamano de la pantalla.\nIdeal con una escala interna baja (1x) en pantallas 1080p o superiores."
en = "FSR upscales the internal render to the display size.\nBest paired with a low internal scale (1x) on a 1080p+ display."
fr = "FSR agrandit le rendu interne à la taille de l'écran.\nIdéal avec une échelle interne basse (1x) sur un écran 1080p ou plus."
de = "FSR skaliert das interne Bild auf die Bildschirmgröße.\nAm besten mit niedriger interner Skalierung (1x) auf einem 1080p+-Display."
it = "FSR scala il rendering interno alla dimensione dello schermo.\nIdeale con una scala interna bassa (1x) su uno schermo 1080p o superiore."
pt = "O FSR amplia a renderização interna para o tamanho da tela.\nIdeal com escala interna baixa (1x) em telas 1080p ou superiores."
ja = "FSRは内部レンダリングを画面サイズに拡大します。\n1080p以上のディスプレイで、内部スケールを低く（1x）したときに最適です。"

["Temporal upscaling: uses previous frames to smooth edges and recover detail. Beta.\nDLSS needs an NVIDIA RTX card and D3D12; otherwise FSR 3 is used."]
es = "Escalado temporal: usa los fotogramas anteriores para suavizar bordes y recuperar detalle. En pruebas (beta).\nDLSS necesita una grafica NVIDIA RTX y D3D12; si no la hay, se usa FSR 3."
en = "Temporal upscaling: uses previous frames to smooth edges and recover detail. Beta.\nDLSS needs an NVIDIA RTX card and D3D12; otherwise FSR 3 is used."
fr = "Agrandissement temporel : utilise les images précédentes pour lisser les contours et retrouver des détails. Bêta.\nDLSS nécessite une carte NVIDIA RTX et D3D12 ; sinon, FSR 3 est utilisé."
de = "Zeitliches Hochskalieren: nutzt vorherige Bilder, um Kanten zu glätten und Details zurückzugewinnen. Beta.\nDLSS benötigt eine NVIDIA-RTX-Karte und D3D12; sonst wird FSR 3 verwendet."
it = "Upscaling temporale: usa i fotogrammi precedenti per ammorbidire i bordi e recuperare dettagli. Beta.\nDLSS richiede una scheda NVIDIA RTX e D3D12; altrimenti si usa FSR 3."
pt = "Upscaling temporal: usa os quadros anteriores para suavizar bordas e recuperar detalhes. Em testes (beta).\nO DLSS precisa de uma placa NVIDIA RTX e D3D12; se não houver, usa-se o FSR 3."
ja = "時間的アップスケール: 前のフレームを使ってエッジを滑らかにし、ディテールを復元します。テスト版です。\nDLSSにはNVIDIA RTXのGPUとD3D12が必要です。ない場合はFSR 3が使われます。"

["Native (best quality)"]
fr = "Natif (meilleure qualité)"
de = "Nativ (beste Qualität)"
it = "Nativo (qualità migliore)"
pt = "Nativa (máxima qualidade)"
ja = "ネイティブ（最高画質）"

["Draws at a lower resolution and the upscaler restores it: smoother on modest PCs."]
fr = "Dessine à plus basse résolution et l'agrandisseur la restaure : plus fluide sur les PC modestes."
de = "Zeichnet in niedrigerer Auflösung, und der Upscaler stellt sie wieder her: flüssiger auf schwachen PCs."
it = "Disegna a risoluzione più bassa e l'upscaler la ricostruisce: più fluido sui PC modesti."
pt = "Desenha em resolução menor e o escalonamento a recupera: mais fluido em PCs modestos."
ja = "より低い解像度で描画し、アップスケーラーで復元します。性能の控えめなPCでより滑らかになります。"

["Like PC games, but only whole scales exist: at 3x, Quality renders at 2x and is scaled to 3x; at 2x only Performance goes lower (to 1x). Real FPS on modest PCs. At 1x there is nothing below."]
fr = "Comme sur PC, mais seules les échelles entières existent : à 3x, Qualité rend en 2x puis agrandit en 3x ; à 2x, seul Performance descend plus bas (à 1x). Vrais FPS sur les PC modestes. À 1x, il n'y a rien en dessous."
de = "Wie bei PC-Spielen, aber es gibt nur ganze Skalierungen: Bei 3x rendert Qualität mit 2x und skaliert auf 3x; bei 2x geht nur Leistung darunter (auf 1x). Echte FPS auf schwachen PCs. Bei 1x gibt es nichts darunter."
it = "Come nei giochi PC, ma esistono solo scale intere: a 3x, Qualità renderizza a 2x e scala a 3x; a 2x solo Prestazioni scende più in basso (a 1x). FPS reali sui PC modesti. A 1x non c'è nulla sotto."
pt = "Como nos jogos de PC, mas só existem escalas inteiras: em 3x, Qualidade renderiza em 2x e é escalado para 3x; em 2x só o Desempenho desce (para 1x). Dá FPS de verdade em PCs modestos. Em 1x não há nada abaixo."
ja = "PCゲームと同様ですが、整数倍のスケールしかありません: 3xでは、クオリティは2xで描画して3xに拡大されます。2xではパフォーマンスのみ下がります（1xまで）。性能の控えめなPCで実際にFPSが上がります。1xではこれ以上下がりません。"

["0 = sharper, 2 = softer"]
fr = "0 = plus net, 2 = plus doux"
de = "0 = schärfer, 2 = weicher"
