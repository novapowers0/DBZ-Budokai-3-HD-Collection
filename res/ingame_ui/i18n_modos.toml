["Folder the DDS files are written to. Pick a drive with free space; the dump can take hundreds of MB."]
fr = "Dossier où les fichiers DDS sont écrits. Choisis un disque avec de la place : l'export peut prendre des centaines de Mo."
de = "Ordner, in den die DDS-Dateien geschrieben werden. Wähle ein Laufwerk mit freiem Speicher; der Export kann hunderte MB belegen."
it = "Cartella in cui vengono scritti i file DDS. Scegli un disco con spazio libero: l'esportazione può occupare centinaia di MB."
