["Each new character needs a slot (a free character number inside the game). There are 26: the 6 characters cut from the original game (Guldo, Jeice, Burter, Zarbon, Dodoria and Android 19) and 20 extra ones. Where it shows up on the select wheel is chosen separately (\"Cell after\")."]
fr = "Chaque nouveau personnage a besoin d'un emplacement (un numéro de personnage libre dans le jeu). Il y en a 26 : les 6 personnages coupés du jeu original (Guldo, Jeice, Burter, Zarbon, Dodoria et Android 19) et 20 supplémentaires. L'endroit où il apparaît sur la roue de sélection se choisit séparément (« Après Cell »)."
de = "Jeder neue Charakter braucht einen Slot (eine freie Charakternummer im Spiel). Es gibt 26: die 6 aus dem Originalspiel gestrichenen Charaktere (Guldo, Jeice, Burter, Zarbon, Dodoria und Android 19) und 20 zusätzliche. Wo er auf dem Auswahlrad erscheint, wird separat gewählt (\"Cell danach\")."
it = "Ogni nuovo personaggio ha bisogno di uno slot (un numero di personaggio libero nel gioco). Ce ne sono 26: i 6 personaggi tagliati dal gioco originale (Guldo, Jeice, Burter, Zarbon, Dodoria e Android 19) e 20 extra. Dove compare sulla ruota di selezione si sceglie a parte (\"Dopo Cell\")."
pt = "Cada personagem novo precisa de uma posição (um número de personagem livre dentro do jogo). São 26: os 6 personagens cortados do jogo original (Guldo, Jeice, Burter, Zarbon, Dodoria e Androide 19) e 20 extras. Onde ele aparece na roda de seleção é escolhido à parte (\"Casela após\")."
