de = "Erstelle die Partie: Du bekommst einen Raumcode für den anderen Spieler. Ihr braucht dieselbe Version und dieselben Mods."
it = "Crea la partita: otterrai un codice stanza da dare all'altro giocatore. Servono entrambi la stessa versione e le stesse mod."
pt = "Crie a partida: você recebe um código de sala para passar ao outro jogador. Vocês dois precisam da mesma versão e dos mesmos mods."
ja = "対戦を作成すると、相手に伝えるルームコードが表示されます。両者が同じバージョンとModを使う必要があります。"

["How the picture is brought to your screen size. FSR is the sharpest; CAS only sharpens. FSR 3 and DLSS smooth edges using previous frames (DLSS only on NVIDIA RTX cards with D3D12; otherwise it uses FSR 3)."]
fr = "Comment l'image est adaptée à la taille de ton écran. FSR est le plus net ; CAS ne fait que renforcer la netteté. FSR 3 et DLSS lissent les bords à partir des images précédentes (DLSS uniquement sur les cartes NVIDIA RTX en D3D12 ; sinon, FSR 3)."
de = "Wie das Bild auf deine Bildschirmgröße gebracht wird. FSR ist am schärfsten; CAS schärft nur nach. FSR 3 und DLSS glätten Kanten mit früheren Bildern (DLSS nur auf NVIDIA-RTX-Karten mit D3D12; sonst FSR 3)."
it = "Come l'immagine viene adattata alle dimensioni del tuo schermo. FSR è il più nitido; CAS aumenta solo la nitidezza. FSR 3 e DLSS levigano i bordi usando i fotogrammi precedenti (DLSS solo su schede NVIDIA RTX con D3D12; altrimenti usa FSR 3)."
pt = "Como a imagem é ajustada ao tamanho da sua tela. O FSR é o mais nítido; o CAS só aumenta a nitidez. O FSR 3 e o DLSS suavizam as bordas usando quadros anteriores (o DLSS só funciona em placas NVIDIA RTX com D3D12; caso contrário, usa o FSR 3)."
ja = "画面サイズに合わせて映像を拡大する方法。FSRが最もシャープ、CASは鮮明化のみ。FSR 3とDLSSは前のフレームを使って輪郭を滑らかにする（DLSSはD3D12のNVIDIA RTXカードでのみ動作し、それ以外ではFSR 3を使用）。"

