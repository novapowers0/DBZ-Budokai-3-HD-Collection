["Dragon World starts with its intro and the original dialogues; Saibamen sprout from the ground and its music plays."]
pt = "O Dragon World começa com a intro e os diálogos do original; os Saibamen brotam do chão e a música dele toca."
ja = "Dragon Worldは原作のイントロと会話から始まり、サイバイマンが地面から現れて専用のBGMが流れる。"
fr = "Le Monde du Dragon démarre avec son intro et les dialogues d'origine ; les Saibaman sortent du sol et sa musique joue."
de = "Die Drachenwelt beginnt mit ihrem Intro und den Original-Dialogen; Saibaman wachsen aus dem Boden und ihre Musik läuft."
it = "Il Mondo del Drago parte con la sua intro e i dialoghi originali; i Saibaman spuntano dal terreno e suona la sua musica."

["Coloured Saibamen: each board battle against one has a different colour."]
pt = "Saibamen coloridos: cada luta do tabuleiro contra um deles sai de uma cor diferente."
ja = "カラフルなサイバイマン：ボード上で戦うたびに、それぞれ別の色で現れる。"
fr = "Saibaman colorés : chaque combat du plateau contre l'un d'eux a une couleur différente."
de = "Bunte Saibaman: jeder Brettkampf gegen einen hat eine andere Farbe."
it = "Saibaman colorati: ogni combattimento sul tabellone contro uno ha un colore diverso."

["The Goku and Gohan training no longer glitches, and missions tell you which character is missing."]
pt = "O treino do Goku e do Gohan não bugga mais, e as missões dizem qual personagem está faltando."
ja = "悟空と悟飯の修行がおかしくならなくなり、ミッションで不足しているキャラクターが分かるようになった。"
fr = "L'entraînement de Goku et Gohan ne se dérègle plus, et les missions indiquent quel personnage manque."
de = "Das Training von Goku und Gohan verrutscht nicht mehr, und die Missionen sagen, welcher Charakter fehlt."
it = "L'allenamento di Goku e Gohan non si scompone più, e le missioni dicono quale personaggio manca."

["Infinite World pack in Nova's Mods: tick the characters and they are built from your game copy."]
pt = "Pacote Infinite World no Nova's Mods: marque os personagens e eles são criados a partir da sua cópia do jogo."
ja = "Nova's Mods の Infinite World パック：キャラクターにチェックを入れると、お手持ちのゲームのコピーから作成されます。"
fr = "Pack Infinite World dans Nova's Mods : coche les personnages et ils sont créés avec ta copie du jeu."
de = "Infinite-World-Paket in Nova's Mods: hake die Charaktere an und sie werden aus deiner Spielkopie erstellt."
it = "Pack Infinite World in Nova's Mods: spunta i personaggi e si creano con la tua copia del gioco."

["Fixed: on some PCs Nova's Mods and the update check did not load."]
pt = "Corrigido: em alguns PCs o Nova's Mods e a verificação de versão não carregavam."
ja = "修正：一部のPCでNova's Modsとアップデート確認が読み込まれない問題を修正しました。"
fr = "Corrigé : sur certains PC, Nova's Mods et la vérification de version ne se chargeaient pas."
de = "Behoben: auf manchen PCs luden Nova's Mods und die Versionsprüfung nicht."
it = "Risolto: su alcuni PC non si caricavano Nova's Mods né il controllo della versione."

["Rank plates, new backgrounds and hosts, and BETA / EXPERIMENTAL labels on what is still being built."]
pt = "Placas de rank, novos fundos e anfitriões, e as etiquetas BETA / EXPERIMENTAL no que ainda está em construção."
ja = "ランクプレート、新しい背景とホスト、そして開発中の機能には BETA / EXPERIMENTAL のラベルを追加。"
fr = "Plaques de rang, nouveaux fonds et hôtes, et marques BÊTA / EXPÉRIMENTAL sur ce qui est en construction."
de = "Rangschilder, neue Hintergründe und Gastgeber sowie BETA- / EXPERIMENTELL-Markierungen für Unfertiges."
it = "Targhe di grado, sfondi e presentatori nuovi, e marchi BETA / SPERIMENTALE su ciò che è in costruzione."

["Teleport relays, also between computer fighters."]
pt = "Revezamentos com teletransporte, também entre lutadores do computador."
ja = "テレポートによる交代。コンピューター操作のキャラクター同士でも可能。"
fr = "Relais par téléportation, aussi entre combattants de l'ordinateur."
de = "Wechsel per Teleport, auch zwischen Computer-Kämpfern."
it = "Cambi con teletrasporto, anche tra combattenti del computer."

["Mods now work when playing straight from the ISO."]
pt = "Os mods já funcionam jogando diretamente da ISO."
ja = "ISOから直接プレイしてもMODが動作するようになりました。"
fr = "Les mods fonctionnent désormais en jouant directement depuis l'ISO."
de = "Mods funktionieren jetzt auch direkt von der ISO."
it = "Le mod ora funzionano giocando direttamente dalla ISO."

["Mission 100, Hero mode (beta), Mr. Satan legend (beta) and the Infinite World and Budokai 2 campaigns (experimental): pick your PS2 ISO in the Game tab."]
pt = "Missão 100, Modo Herói (beta), lenda do Mr. Satan (beta) e as campanhas do Infinite World e do Budokai 2 (experimental): escolha sua ISO de PS2 na aba Jogo."
ja = "ミッション100、ヒーローモード（ベータ）、ミスター・サタンの伝説（ベータ）、Infinite World と Budokai 2 のキャンペーン（実験的）：「ゲーム」タブで PS2 の ISO を選んでください。"
fr = "Mission 100, mode Héros (bêta), Légende de Mr. Satan (bêta) et les campagnes d'Infinite World et Budokai 2 (expérimentales) : choisis ton ISO PS2 dans l'onglet Jeu."
de = "Mission 100, Heldenmodus (Beta), Mr.-Satan-Legende (Beta) und die Kampagnen von Infinite World und Budokai 2 (experimentell): wähle deine PS2-ISO im Tab Spiel."
it = "Missione 100, modalità Eroe (beta), Leggenda di Mr. Satan (beta) e le campagne di Infinite World e Budokai 2 (sperimentali): scegli la tua ISO PS2 nella scheda Gioco."

["Renewed launcher and F1 menu, and everything translated into five languages."]
pt = "Launcher e menu F1 renovados, e tudo traduzido para cinco idiomas."
ja = "ランチャーとF1メニューを刷新し、すべてを5か国語に翻訳しました。"
fr = "Launcher et menu F1 repensés, et tout traduit en cinq langues."
de = "Neuer Launcher und neues F1-Menü, alles in fünf Sprachen übersetzt."
it = "Launcher e menu F1 rinnovati, e tutto tradotto in cinque lingue."

["Ring out with a partner still standing: they come in and the fight goes on."]
pt = "Se for jogado para fora do ringue com um companheiro ainda de pé, ele entra e a luta continua."
ja = "パートナーが残っていれば、場外に落ちても交代して戦いが続く。"
fr = "Sorti du ring avec un partenaire encore debout : il entre et le combat continue."
de = "Ring-out, aber dein Partner steht noch: Er kommt rein und der Kampf geht weiter."
it = "Se ti buttano fuori dal ring e hai ancora un compagno, entra lui e il combattimento continua."

["The incoming fighter flies in and powers up with the game's own ki pose."]
pt = "Quem entra chega voando e carrega ki com a pose do próprio jogo."
ja = "交代するキャラクターは飛んで入場し、ゲーム本来の気の溜めポーズで構える。"
fr = "Le combattant qui entre arrive en volant et charge son ki avec la pose du jeu."
de = "Der Einwechselnde fliegt herein und lädt Ki mit der Pose des Spiels auf."
it = "Chi entra arriva in volo e carica il ki con la posa del gioco."

["Different mods no longer drop the connection: the panel shows what is missing and installs it from Nova's Mods."]
pt = "Mods diferentes não derrubam mais a conexão: o painel mostra o que falta e instala a partir do Nova's Mods."
ja = "MODが異なっていても接続が切れなくなりました。パネルで不足しているものを表示し、Nova's Mods から自動インストールします。"
fr = "Des mods différents ne coupent plus la connexion : le panneau indique ce qui manque et l'installe depuis Nova's Mods."
de = "Unterschiedliche Mods trennen die Verbindung nicht mehr: Das Panel zeigt, was fehlt, und installiert es aus Nova's Mods."
it = "Avere mod diverse non interrompe più la connessione: il pannello dice cosa manca e lo installa da Nova's Mods."

["Automatic router port opening (UPnP) is back."]
pt = "A abertura automática de porta do roteador (UPnP) voltou."
ja = "ルーターの自動ポート開放（UPnP）が復活しました。"
fr = "L'ouverture automatique du port du routeur (UPnP) est de retour."
de = "Die automatische Portfreigabe am Router (UPnP) ist zurück."
it = "Torna l'apertura automatica della porta del router (UPnP)."

["HD texture packs load without hitches and apply as soon as you press PLAY."]
pt = "Os packs de texturas HD carregam sem travamentos e são aplicados assim que você aperta JOGAR."
ja = "HDテクスチャパックはカクつかずに読み込まれ、PLAYを押すとすぐに適用されます。"
fr = "Les packs de textures HD se chargent sans saccades et s'appliquent dès que tu appuies sur JOUER."
de = "HD-Texturpakete laden ohne Ruckler und gelten, sobald du SPIELEN drückst."
it = "I pacchetti di texture HD si caricano senza scatti e si applicano appena premi GIOCA."

["SSGPrinceVegeta's HD pack installs in one click from Nova's Mods."]
pt = "O pack HD do SSGPrinceVegeta é instalado com um clique no Nova's Mods."
ja = "SSGPrinceVegeta の HD パックは Nova's Mods からワンクリックでインストールできます。"
fr = "Le pack HD de SSGPrinceVegeta s'installe en un clic depuis Nova's Mods."
de = "Das HD-Paket von SSGPrinceVegeta wird mit einem Klick über Nova's Mods installiert."
it = "Il pacchetto HD di SSGPrinceVegeta si installa con un clic da Nova's Mods."

["New Game tab: Tag Team, Online and the other modes in one place, plus a quick start option."]
pt = "Nova aba Jogo: Tag Team, Online e os outros modos num só lugar, com opção de início rápido."
ja = "新しい「ゲーム」タブ：Tag Team、Online などのモードを一か所にまとめ、クイックスタートも追加。"
fr = "Nouvel onglet Jeu : Tag Team, Online et les autres modes au même endroit, avec démarrage rapide."
de = "Neuer Tab Spiel: Tag Team, Online und die anderen Modi an einem Ort, dazu ein Schnellstart."
it = "Nuova scheda Gioco: Tag Team, Online e le altre modalità in un solo posto, con avvio rapido."

["Spanish texts with proper accents. Click a mod to see its info card."]
pt = "Textos em espanhol com acentos corretos. Clique em um mod para ver a ficha."
ja = "スペイン語の表記を正しいアクセント付きで表示。MODをクリックすると情報カードが見られます。"
fr = "Textes espagnols avec leurs accents. Clique sur un mod pour voir sa fiche."
de = "Spanische Texte mit korrekten Akzenten. Klicke auf einen Mod, um seine Karte zu sehen."
it = "Testi in spagnolo con i loro accenti. Clicca su una mod per vederne la scheda."

["Official ports in one click: Goku GT, Vegeta GT, Pan, Baby, Janemba, sword Trunks and Future Gohan."]
pt = "Ports oficiais com um clique: Goku GT, Vegeta GT, Pan, Baby, Janemba, Trunks da espada e Gohan do Futuro."
ja = "公式ポートをワンクリックで：悟空GT、ベジータGT、パン、ベビー、ジャンバ、剣のトランクス、未来の悟飯。"
fr = "Ports officiels en un clic : Goku GT, Vegeta GT, Pan, Baby, Janemba, Trunks à l'épée et Gohan du Futur."
de = "Offizielle Ports mit einem Klick: Goku GT, Vegeta GT, Pan, Baby, Janemba, Trunks mit Schwert und Zukunfts-Gohan."
it = "Port ufficiali con un clic: Goku GT, Vegeta GT, Pan, Baby, Janemba, Trunks con la spada e Gohan del Futuro."

