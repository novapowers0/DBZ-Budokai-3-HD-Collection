["Some new modes use your copy of other Dragon Ball Z PlayStation 2 games. Press 'Pick ISO' and find that game's .iso file: nothing is copied or changed, it only remembers where it is. They are not separate games and the launcher does not open them: press PLAY (Budokai 3), open HUB from the main menu and choose Gateway, where their stories and minigames are."]
fr = "Certains nouveaux modes utilisent ta copie d'autres jeux Dragon Ball Z sur PlayStation 2. Appuie sur « Choisir l'ISO » et trouve le fichier .iso de ce jeu : rien n'est copié ni modifié, il retient seulement où il se trouve. Ce ne sont pas des jeux à part et le lanceur ne les ouvre pas : appuie sur JOUER (Budokai 3), ouvre HUB depuis le menu principal et choisis Passerelle, où se trouvent leurs histoires et leurs mini-jeux."
de = "Einige neue Modi nutzen deine Kopie anderer Dragon-Ball-Z-Spiele für PlayStation 2. Drücke 'ISO auswählen' und finde die .iso-Datei des Spiels: Es wird nichts kopiert oder verändert, nur der Speicherort gemerkt. Es sind keine eigenen Spiele, und der Launcher öffnet sie nicht: Drücke SPIELEN (Budokai 3), öffne im Hauptmenü HUB und wähle Portal, wo ihre Geschichten und Minispiele sind."
it = "Alcune nuove modalità usano la tua copia di altri giochi Dragon Ball Z per PlayStation 2. Premi 'Scegli ISO' e trova il file .iso di quel gioco: non viene copiato né modificato nulla, ricorda solo dove si trova. Non sono giochi separati e il launcher non li apre: premi GIOCA (Budokai 3), entra in HUB dal menu principale e scegli Passerella, dove si trovano le loro storie e i loro minigiochi."
pt = "Alguns modos novos usam sua cópia de outros jogos de Dragon Ball Z do PlayStation 2. Pressione «Escolher ISO» e encontre o arquivo .iso desse jogo: nada é copiado ou alterado, só se guarda onde ele está. Não são jogos separados e o launcher não os abre: pressione JOGAR (Budokai 3), abra HUB no menu principal e escolha Portal, onde estão suas histórias e minijogos."
ja = "一部の新しいモードでは、お持ちのPlayStation 2版の他のドラゴンボールZゲームを使用します。「ISOを選択」を押して、そのゲームの.isoファイルを指定してください。何もコピーや変更はされず、場所を記憶するだけです。これらは別のゲームではなく、ランチャーからは起動しません。「プレイ」（Budokai 3）を押し、メインメニューの「HUB」から「ゲートウェイ」を選ぶと、そのストーリーやミニゲームを遊べます。"

