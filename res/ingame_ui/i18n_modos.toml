pt = "Registro de E/S de disco (a cada 5 s)"
ja = "ディスクI/Oログ（5秒ごと）"

["Writes one line every 5 seconds with AFS reads (count, MB, average/p95/p99 latency, worst and slow reads) plus one line per slow read. The way to tell whether a hitch comes from the disk."]
fr = "Écrit une ligne toutes les 5 secondes avec les lectures AFS (nombre, Mo, latence moyenne/p95/p99, lectures les plus lentes et lentes) plus une ligne par lecture lente. C'est le moyen de savoir si un saccadement vient du disque."
de = "Schreibt alle 5 Sekunden eine Zeile mit den AFS-Lesevorgängen (Anzahl, MB, mittlere/p95/p99-Latenz, langsamste und langsame Lesevorgänge) plus eine Zeile pro langsamem Lesevorgang. So erkennst du, ob ein Ruckler von der Festplatte kommt."
it = "Scrive una riga ogni 5 secondi con le letture AFS (numero, MB, latenza media/p95/p99, letture peggiori e lente) più una riga per ogni lettura lenta. Il modo per capire se uno scatto viene dal disco."
pt = "Escreve uma linha a cada 5 segundos com as leituras dos AFS (quantidade, MB, latência média/p95/p99, máximos e leituras lentas) e uma linha para cada leitura lenta. É a forma de ver se um travamento vem do disco."
ja = "5秒ごとに、AFSの読み取り（回数、MB、平均/p95/p99のレイテンシ、最大値、遅い読み取り）を1行で書き込み、遅い読み取りごとに1行追加します。カクつきがディスクによるものかを確認する方法です。"

