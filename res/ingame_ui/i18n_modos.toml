ja = "ユニークなテクスチャをすべてDDS + index.jsonlとして書き出し、テクスチャパックの作成に使えるようにします（PCSX2方式）。数百MBになることがあるため、空き容量のあるフォルダを選んでください。開発用のみで、再起動が必要です。HDテクスチャ強化が有効な間は効果がありません。"

