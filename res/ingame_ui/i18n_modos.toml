it = "Media (bilanciata)"
pt = "Médio (equilibrado)"
ja = "中（バランス型）"

["High (more textures, more VRAM)"]
fr = "Haute (plus de textures, plus de VRAM)"
de = "Hoch (mehr Texturen, mehr VRAM)"
it = "Alta (più texture, più VRAM)"
pt = "Alto (mais texturas, mais VRAM)"
ja = "高（より多くのテクスチャ、VRAMを多く使用）"

["HD textures: spending (advanced)"]
fr = "Textures HD : consommation (avancé)"
de = "HD-Texturen: Aufwand (erweitert)"
it = "Texture HD: consumo (avanzato)"
pt = "Texturas HD: quanto gastar (avançado)"
ja = "HDテクスチャ: 使用量（上級者向け）"

["Which textures get enhanced based on size. \"Low\" only touches small and medium ones (much less cost); \"High\" also the big stage textures (more noticeable, more cost). Changes the VRAM and GPU usage of the texture enhancement."]
fr = "Quelles textures sont améliorées selon leur taille. « Basse » ne touche que les petites et moyennes (bien moins coûteux) ; « Haute » améliore aussi les grandes textures de décors (plus visible, plus coûteux). Modifie la VRAM et la charge GPU de l'amélioration des textures."
de = "Welche Texturen je nach Größe verbessert werden. 'Niedrig' betrifft nur kleine und mittlere (deutlich weniger Aufwand); 'Hoch' auch die großen Stage-Texturen (stärker sichtbar, mehr Aufwand). Ändert den VRAM- und GPU-Verbrauch der Texturverbesserung."
it = "Quali texture vengono migliorate in base alla dimensione. \"Bassa\" tocca solo quelle piccole e medie (costo molto minore); \"Alta\" include anche le grandi texture degli scenari (più visibile, più costo). Cambia l'uso di VRAM e GPU del miglioramento texture."
pt = "Quais texturas são melhoradas conforme o tamanho. \"Baixo\" mexe apenas nas pequenas e médias (muito menos custo); \"Alto\" também nas grandes de cenário (mais notável, mais custo). Altera a VRAM e o uso da GPU da melhoria de texturas."
