de = "Eigene Kapseln: werden mit ihrem Namen im Kampf und in der Fähigkeitenliste angezeigt. Spezialattacken und Ultimates ersetzen die des Spenders der Reihe nach; eine Transformation bekommt ihre eigene Kapsel."
it = "Capsule proprie: mostrate con il loro nome in battaglia e nell'elenco abilità. Speciali e ultimate sostituiscono quelle del donatore in ordine; una trasformazione riceve una capsula propria."
pt = "Cápsulas próprias: aparecem com seu nome no combate e na lista de habilidades. As especiais e definitivas substituem, em ordem, as do doador; uma transformação recebe sua própria cápsula."
ja = "独自のカプセル: バトル中と技リストに名前付きで表示されます。スペシャルと究極技は提供元の技を順番に置き換えます。変身には独自のカプセルが与えられます。"

