["Asynchronous (default) compiles shaders in parallel: faster loads, but may hitch the first time each effect appears. Turn it off to compile them on the spot (no hitching, slower initial load)."]
fr = "Asynchrone (par défaut) compile les shaders en parallèle : chargements plus rapides, mais peut saccader la première fois que chaque effet apparaît. Désactive-le pour les compiler sur place (pas de saccade, chargement initial plus lent)."
de = "Asynchron (Standard) kompiliert Shader parallel: schnellere Ladezeiten, kann aber beim ersten Auftreten jedes Effekts ruckeln. Ausschalten, um sie sofort zu kompilieren (kein Ruckeln, langsamerer Start)."
it = "Asincrono (predefinito) compila gli shader in parallelo: caricamenti più veloci, ma può scattare la prima volta che compare ogni effetto. Disattivalo per compilarli sul momento (niente scatti, caricamento iniziale più lento)."
pt = "Em segundo plano (padrão): os shaders são compilados em paralelo; carregamento mais rápido, mas pode travar um pouco na primeira vez que cada efeito aparece. Desative para compilá-los na hora (sem travamentos, carregamento inicial mais lento)."
ja = "非同期（既定）: シェーダーを並列にコンパイルするため読み込みが速くなりますが、各エフェクトが初めて現れたときに一瞬カクつくことがあります。オフにすると、その場でコンパイルします（カクつきなし、初回の読み込みは遅くなります）。"

