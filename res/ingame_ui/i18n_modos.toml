fr = "Assombrit légèrement les angles, les plis des vêtements et les endroits où les personnages touchent le sol. Seulement sur la scène 3D : le HUD et les menus ne changent pas. Direct3D 12 uniquement. Expérimental : coûte des performances (Élevé, plus). Si le jeu saccade, baisse-le ou désactive-le."
