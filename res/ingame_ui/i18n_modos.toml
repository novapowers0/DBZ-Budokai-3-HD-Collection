["Sharpens the game's textures (faces, clothes, stages). It runs on the GPU: noticeably raises power draw and VRAM usage. Start with \"Sharp\"; if you notice slowdowns, switch back to Off. Requires restarting the game."]
fr = "Affine les textures du jeu (visages, vêtements, décors). Elle tourne sur la carte graphique : elle augmente nettement la consommation et la mémoire vidéo utilisée. Commence par « Net » ; si tu remarques des ralentissements, repasse sur Désactivé. Nécessite de redémarrer le jeu."
de = "Schärft die Texturen des Spiels (Gesichter, Kleidung, Stages). Sie läuft auf der GPU: spürbar mehr Stromverbrauch und VRAM-Nutzung. Beginne mit \"Scharf\"; wenn es ruckelt, schalte auf Aus zurück. Erfordert einen Neustart des Spiels."
it = "Rende più nitide le texture del gioco (volti, vestiti, scenari). Gira sulla GPU: aumenta sensibilmente consumi e uso della VRAM. Inizia con \"Nitido\"; se noti rallentamenti, torna su Disattivato. Richiede il riavvio del gioco."
pt = "Aumenta a nitidez das texturas do jogo (rostos, roupas, cenários). Funciona na GPU: aumenta bastante o consumo e o uso de VRAM. Comece por \"Nítidas\"; se notar lentidão, volte para Desativado. Requer reiniciar o jogo."
ja = "ゲームのテクスチャ（顔、衣装、ステージ）をシャープにします。GPUで動作し、消費電力とVRAM使用量が大きく増えます。まず「シャープ」から始め、重くなる場合はオフに戻してください。ゲームの再起動が必要です。"

["Experimental: higher GPU and VRAM usage"]
fr = "Expérimental : GPU et VRAM plus sollicitées"
de = "Experimentell: höhere GPU- und VRAM-Nutzung"
it = "Sperimentale: più uso di GPU e VRAM"
pt = "Experimental: maior consumo de GPU e VRAM"
ja = "実験的: GPUとVRAMの使用量が増加"

["Note: internal scale + texture enhancement multiply the cost. If you notice stutters or the game drops to 30, set the scale back to 1x (below) or turn the enhancement off."]
fr = "Remarque : l'échelle interne et l'amélioration des textures se cumulent. Si tu remarques des saccades ou que le jeu tombe à 30, remets l'échelle à 1x (ci-dessous) ou désactive l'amélioration."
de = "Hinweis: Interne Skalierung und Texturverbesserung addieren sich in den Kosten. Wenn es ruckelt oder das Spiel auf 30 fällt, stelle die Skalierung auf 1x (unten) zurück oder schalte die Verbesserung aus."
it = "Nota: scala interna e miglioramento texture sommano i costi. Se noti scatti o il gioco scende a 30, riporta la scala a 1x (sotto) o disattiva il miglioramento."
pt = "Aviso: escala interna + melhoria de texturas multiplicam o custo. Se notar travamentos ou o jogo cair para 30, deixe a escala em 1x (abaixo) ou desative a melhoria."
ja = "注意: 内部スケールとテクスチャ強化は負荷を掛け合わせます。カクつく場合やゲームが30fpsに落ちる場合は、スケールを1x（下）に戻すか、強化をオフにしてください。"

