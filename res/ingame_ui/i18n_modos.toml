["WARNING: changes the fight rules, as in Infinite World. L2 is Aura Burst: needs one ki bar, drains ki while active and leaves no fatigue when it ends. The ultimate is Up + Circle. No Dragon Rush. Off is the original game. Online, only if both players have it on."]
fr = "ATTENTION : change les règles du combat, comme dans Infinite World. L2 est Aura Burst : demande une barre de ki, consomme du ki pendant l'effet et ne laisse pas de fatigue à la fin. L'ultime se fait avec Haut + Cercle. Pas de Dragon Rush. Désactivé, c'est le jeu d'origine. En ligne, seulement si les deux joueurs l'ont activé."
de = "ACHTUNG: ändert die Kampfregeln wie in Infinite World. L2 ist Aura Burst: braucht einen Ki-Balken, verbraucht Ki während der Wirkung und hinterlässt am Ende keine Müdigkeit. Der Ultimate geht mit Oben + Kreis. Kein Dragon Rush. Aus ist das Originalspiel. Online nur, wenn beide Spieler es anhaben."
it = "ATTENZIONE: cambia le regole del combattimento, come in Infinite World. L2 è Aura Burst: richiede una barra di ki, consuma ki mentre è attivo e non lascia stanchezza alla fine. La finale si fa con Su + Cerchio. Niente Dragon Rush. Spento è il gioco originale. Online, solo se entrambi i giocatori lo hanno attivo."
pt = "AVISO: muda as regras do combate, como em Infinite World. L2 é Aura Burst: pede uma barra de ki, gasta ki enquanto dura e não deixa cansaço no fim. A definitiva sai com Cima + Círculo. Sem Dragon Rush. Desligado é o jogo original. Online, só se os dois jogadores o tiverem ligado."
ja = "警告：Infinite Worldのように戦闘ルールが変わります。L2はオーラバースト：気バー1本が必要で、発動中は気を消費し、終了時に疲労しません。究極技は上＋○。Dragon Rushはなし。オフなら原作どおり。オンラインでは両者がオンの場合のみ。"

["During the fight the stage goes from day to dusk (warm haze) and to night (dark sky and blue haze). Display only: the fight does not change. Not used online."]
