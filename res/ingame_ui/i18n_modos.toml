de = "CAS wendet nach dem Skalieren eine kontrastadaptive Schärfung an.\nSehr gut bei hoher interner Skalierung (2x-3x)."
it = "CAS applica una nitidezza adattiva al contrasto dopo lo scaling.\nOttimo con una scala interna alta (2x-3x)."
pt = "O CAS aplica nitidez adaptativa ao contraste depois do escalonamento.\nMuito bom com escala interna alta (2x-3x)."
ja = "CASは拡大後にコントラストに応じた適応シャープ化を行います。\n内部スケールが高い（2x-3x）ときに非常に効果的です。"

