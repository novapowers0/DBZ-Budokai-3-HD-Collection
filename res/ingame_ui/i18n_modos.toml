["Reads the port's moveset and creates one capsule for each attack that needs one (specials, ultimate, transformations), named as in its game when known (Infinite World: capsule list in \"modding resources\"). A Budokai 3 port keeps the original capsules. Existing capsules are backed up (personaje.toml.antes_de_importar)."]
fr = "Lit le moveset du port et crée une capsule pour chaque attaque qui en a besoin (spéciales, ultime, transformations), nommée comme dans son jeu quand c'est connu (Infinite World : liste des capsules dans « ressources de modding »). Un port de Budokai 3 garde les capsules d'origine. Les capsules existantes sont sauvegardées (personaje.toml.antes_de_importar)."
de = "Liest das Moveset des Ports und erstellt für jeden Angriff, der eine braucht (Spezialattacken, Ultimate, Transformationen), eine Kapsel, benannt wie in seinem Spiel, wenn bekannt (Infinite World: Kapselliste in 'Modding-Ressourcen'). Ein Budokai-3-Port behält die Originalkapseln. Vorhandene Kapseln werden gesichert (personaje.toml.antes_de_importar)."
it = "Legge il moveset del port e crea una capsula per ogni attacco che ne ha bisogno (speciali, ultimate, trasformazioni), con il nome del suo gioco quando noto (Infinite World: elenco capsule in 'risorse per il modding'). Un port di Budokai 3 mantiene le capsule originali. Le capsule esistenti vengono salvate (personaje.toml.antes_de_importar)."
pt = "Lê o moveset do port e cria uma cápsula para cada ataque que a exija (especiais, definitiva, transformações), com o nome do jogo de origem quando for conhecido (Infinite World: lista de cápsulas de \"modding resources\"). Um port do Budokai 3 mantém as cápsulas originais. Se já tinha cápsulas, é guardada uma cópia (personaje.toml.antes_de_importar)."
ja = "移植版の技セットを読み取り、カプセルが必要な技（スペシャル、究極技、変身）ごとにカプセルを1つ作成します。元のゲームでの名前が分かる場合はその名前を使います（Infinite World: \"modding resources\" のカプセル一覧）。Budokai 3 の移植版は元のカプセルを維持します。既存のカプセルがある場合はコピーが保存されます（personaje.toml.antes_de_importar）。"

