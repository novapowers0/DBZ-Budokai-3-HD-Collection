["Lets the game discard hidden geometry (default). On slow GPUs, turning them off removes host waits at the cost of extra overdraw: useful for diagnosis."]
fr = "Permet au jeu d'ignorer la géométrie cachée (par défaut). Sur les GPU lents, les désactiver supprime les attentes côté hôte au prix de plus de surdessin : utile pour le diagnostic."
de = "Lässt das Spiel verdeckte Geometrie verwerfen (Standard). Bei langsamen GPUs entfallen durch Ausschalten die Host-Wartezeiten, dafür wird mehr Überzeichnung nötig: nützlich zur Diagnose."
it = "Permette al gioco di scartare la geometria nascosta (predefinito). Sulle GPU lente, disattivarle elimina le attese lato host al costo di più overdraw: utile per la diagnosi."
pt = "Permite que o jogo descarte geometria oculta (padrão). Em GPUs fracas, desativar elimina esperas do host ao custo de desenhar mais: útil para diagnóstico."
ja = "ゲームが非表示のジオメトリを破棄できるようにします（既定）。GPUの性能が足りない場合、オフにするとホストの待機が減りますが、描画量が増えます。診断用です。"

