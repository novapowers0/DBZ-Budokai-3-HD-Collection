it = "Scrivi il codice del tuo amico e premi Invio (oppure copialo e premi X per incollarlo)."
pt = "Digite o código que seu amigo passou e aperte Enter (ou copie e aperte X para colar)."
ja = "友達のコードを入力してEnterを押します(コピーしてXで貼り付けも可)。"

