["1) Pick the character and press 'Extract textures to PNG'.  2) Edit the PNGs with any drawing program.  3) Press 'Create the mod from my PNGs': it turns on by itself and you remove it in the Mods tab. To change any other game texture (menus, stages), use 'Make your own texture pack' in the Mods tab."]
fr = "1) Choisis le personnage et appuie sur « Extraire les textures en PNG ». 2) Modifie les PNG avec n'importe quel logiciel de dessin. 3) Appuie sur « Créer le mod à partir de mes PNG » : il s'active tout seul et tu le retires dans l'onglet Mods. Pour modifier une autre texture du jeu (menus, décors), utilise « Crée ton propre pack de textures » dans l'onglet Mods."
de = "1) Wähle den Charakter und drücke 'Texturen als PNG extrahieren'. 2) Bearbeite die PNGs mit einem beliebigen Zeichenprogramm. 3) Drücke 'Mod aus meinen PNGs erstellen': Er schaltet sich selbst ein, und du entfernst ihn im Tab Mods. Für andere Spieltexturen (Menüs, Stages) verwende im Tab Mods 'Eigenes Textur-Pack erstellen (PNG)'."
it = "1) Scegli il personaggio e premi 'Estrai texture in PNG'. 2) Modifica i PNG con un qualsiasi programma di disegno. 3) Premi 'Crea la mod dai miei PNG': si attiva da sola e la rimuovi nella scheda Mod. Per cambiare altre texture del gioco (menu, scenari) usa 'Crea il tuo pacchetto texture (PNG)' nella scheda Mod."
pt = "1) Escolha o personagem e clique em 'Extrair texturas para PNG'. 2) Edite os PNG com qualquer programa de desenho. 3) Clique em 'Criar o mod com meus PNG': ele se ativa sozinho e você o remove na aba Mods. Para mudar qualquer outra textura do jogo (menus, cenários), use 'Criar seu próprio pacote de texturas' na aba Mods."
ja = "1) キャラクターを選び「テクスチャをPNGに抽出」を押します。2) 任意の描画ソフトでPNGを編集します。3) 「自分のPNGからModを作成」を押します。自動で有効になり、Modsタブで削除できます。他のゲーム内テクスチャ（メニュー、ステージなど）を変更するには、Modsタブの「自分のテクスチャパックを作成」を使ってください。"

