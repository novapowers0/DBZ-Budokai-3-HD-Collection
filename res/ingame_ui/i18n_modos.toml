["The game is drawn at a higher resolution and then scaled down: much cleaner edges, but the graphics card works much harder (each step costs roughly twice as much). Start at 1x."]
fr = "Le jeu est dessiné en plus haute résolution puis réduit : des contours bien plus propres, mais la carte graphique travaille beaucoup plus (chaque cran coûte environ deux fois plus). Commence à 1x."
de = "Das Spiel wird in höherer Auflösung gezeichnet und dann verkleinert: deutlich sauberere Kanten, aber die Grafikkarte arbeitet viel mehr (jede Stufe kostet etwa doppelt so viel). Beginne mit 1x."
it = "Il gioco viene disegnato in risoluzione più alta e poi ridotto: bordi molto più puliti, ma la GPU lavora molto di più (ogni passo costa circa il doppio). Parti da 1x."
pt = "O jogo é desenhado em resolução maior e depois reduzido: bordas bem mais limpas, mas a placa de vídeo trabalha muito mais (cada passo custa aproximadamente o dobro). Comece em 1x."
ja = "ゲームをより高い解像度で描画してから縮小します。エッジがはるかに滑らかになりますが、GPUの負担が大きく増えます（各段階で負荷はおよそ2倍）。まずは1xから始めてください。"

["Supersampling on: the GPU will work much harder (not needed to play 720p flawlessly)."]
fr = "Supersampling activé : la carte graphique travaille beaucoup plus (pas nécessaire pour jouer en 720p sans problème)."
de = "Supersampling an: Die GPU arbeitet deutlich mehr (für flüssiges Spielen in 720p nicht nötig)."
it = "Supersampling attivo: la GPU lavora molto di più (non serve per giocare a 720p senza problemi)."
pt = "Supersampling ativo: a GPU vai trabalhar bem mais (não é necessário para jogar 720p perfeitamente)."
ja = "スーパーサンプリング有効: GPUの負荷がかなり増えます（720pで問題なく遊ぶには不要です）。"

