["720p is the normal one. 360p uses the game's SD path (640x360): half the pixels per side. 240p and 144p lower only the scenery and characters: the HUD and menus stay sharp. To reduce load use 1x and turn MSAA off. Helps if the graphics card is the limit; if the processor is the limit (usual on weak PCs) it will not give more FPS."]
es = "720p es lo normal. 360p usa la ruta SD del juego (640x360): la mitad de pixeles por lado. 240p y 144p bajan solo el escenario y los personajes: el HUD y los menus siguen nitidos. Para reducir carga usa 1x y apaga MSAA. Ayuda si el limite es la grafica; si el limite es el procesador (lo habitual en equipos flojos) no dara mas FPS."
en = "720p is the normal one. 360p uses the game's SD path (640x360): half the pixels per side. 240p and 144p lower only the scenery and characters: the HUD and menus stay sharp. To reduce load use 1x and turn MSAA off. Helps if the graphics card is the limit; if the processor is the limit (usual on weak PCs) it will not give more FPS."
fr = "720p est la normale. 360p utilise le mode SD du jeu (640x360) : deux fois moins de pixels par côté. 240p et 144p ne baissent que le décor et les personnages : le HUD et les menus restent nets. Pour réduire la charge, utilise 1x et désactive le MSAA. Aide si la carte graphique est la limite ; si c'est le processeur (fréquent sur les PC faibles), cela ne donnera pas plus d'images par seconde."
de = "720p ist normal. 360p nutzt den SD-Pfad des Spiels (640x360): halb so viele Pixel pro Seite. 240p und 144p senken nur Szenerie und Figuren: HUD und Menüs bleiben scharf. Zur Entlastung 1x nutzen und MSAA ausschalten. Hilft, wenn die Grafikkarte limitiert; limitiert der Prozessor (bei schwachen PCs üblich), bringt es keine höhere Bildrate."
it = "720p è la norma. 360p usa il percorso SD del gioco (640x360): metà dei pixel per lato. 240p e 144p abbassano solo scenario e personaggi: HUD e menu restano nitidi. Per ridurre il carico usa 1x e disattiva l'MSAA. Aiuta se il limite è la scheda grafica; se il limite è il processore (comune sui PC deboli) non darà più FPS."
pt = "720p é o normal. 360p usa o modo SD do jogo (640x360): metade dos pixels por lado. 240p e 144p baixam só o cenário e os personagens: o HUD e os menus continuam nítidos. Para reduzir a carga use 1x e desligue o MSAA. Ajuda se o limite for a placa de vídeo; se o limite for o processador (comum em PCs fracos), não dará mais FPS."
ja = "720pが標準です。360pはゲームのSD経路（640x360）を使い、1辺あたりのピクセル数が半分になります。240pと144pは背景とキャラクターのみを下げるので、HUDとメニューは鮮明なままです。負荷を下げるには1xにしてMSAAを切ってください。GPUが上限なら効果がありますが、CPUが上限の場合（低性能PCでは一般的）はFPSは上がりません。"

