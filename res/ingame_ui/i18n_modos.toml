de = "Liest größere Blöcke auf einmal und liefert die folgenden Lesevorgänge aus dem RAM: hilft bei mechanischen Festplatten und beim Laden. Wird automatisch deaktiviert, solange Mods installiert sind."
it = "Legge blocchi più grandi in una volta e serve le letture successive dalla RAM: aiuta sui dischi meccanici e durante i caricamenti. Disattivata automaticamente finché sono installate mod."
pt = "Lê blocos maiores de uma vez e serve as leituras seguintes da memória: ajuda em discos mecânicos e durante os carregamentos. Fica desativada automaticamente enquanto houver mods instalados."
