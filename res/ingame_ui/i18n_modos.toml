["Compile shaders asynchronously"]
fr = "Compiler les shaders de façon asynchrone"
de = "Shader asynchron kompilieren"
it = "Compila gli shader in modo asincrono"
pt = "Compilar shaders em segundo plano"
ja = "シェーダーを非同期でコンパイル"

["Asynchronous (default) compiles shaders in parallel: faster loads, but may hitch the first time each effect appears. Turn it off to compile them on the spot (no hitching, slower initial load)."]
fr = "Asynchrone (par défaut) compile les shaders en parallèle : chargements plus rapides, mais peut saccader la première fois que chaque effet apparaît. Désactive-le pour les compiler sur place (pas de saccade, chargement initial plus lent)."
de = "Asynchron (Standard) kompiliert Shader parallel: schnellere Ladezeiten, kann aber beim ersten Auftreten jedes Effekts ruckeln. Ausschalten, um sie sofort zu kompilieren (kein Ruckeln, langsamerer Start)."
it = "Asincrono (predefinito) compila gli shader in parallelo: caricamenti più veloci, ma può scattare la prima volta che compare ogni effetto. Disattivalo per compilarli sul momento (niente scatti, caricamento iniziale più lento)."
pt = "Em segundo plano (padrão): os shaders são compilados em paralelo; carregamento mais rápido, mas pode travar um pouco na primeira vez que cada efeito aparece. Desative para compilá-los na hora (sem travamentos, carregamento inicial mais lento)."
ja = "非同期（既定）: シェーダーを並列にコンパイルするため読み込みが速くなりますが、各エフェクトが初めて現れたときに一瞬カクつくことがあります。オフにすると、その場でコンパイルします（カクつきなし、初回の読み込みは遅くなります）。"

["Game occlusion queries"]
fr = "Requêtes d'occlusion du jeu"
de = "Occlusionsabfragen des Spiels"
it = "Query di occlusione del gioco"
pt = "Consultas de oclusão do jogo"
ja = "ゲームのオクルージョンクエリ"

["Lets the game discard hidden geometry (default). On slow GPUs, turning them off removes host waits at the cost of extra overdraw: useful for diagnosis."]
fr = "Permet au jeu d'ignorer la géométrie cachée (par défaut). Sur les GPU lents, les désactiver supprime les attentes côté hôte au prix de plus de surdessin : utile pour le diagnostic."
de = "Lässt das Spiel verdeckte Geometrie verwerfen (Standard). Bei langsamen GPUs entfallen durch Ausschalten die Host-Wartezeiten, dafür wird mehr Überzeichnung nötig: nützlich zur Diagnose."
it = "Permette al gioco di scartare la geometria nascosta (predefinito). Sulle GPU lente, disattivarle elimina le attese lato host al costo di più overdraw: utile per la diagnosi."
pt = "Permite que o jogo descarte geometria oculta (padrão). Em GPUs fracas, desativar elimina esperas do host ao custo de desenhar mais: útil para diagnóstico."
ja = "ゲームが非表示のジオメトリを破棄できるようにします（既定）。GPUの性能が足りない場合、オフにするとホストの待機が減りますが、描画量が増えます。診断用です。"

["Performance log (every 5 s)"]
fr = "Journal de performance (toutes les 5 s)"
de = "Leistungsprotokoll (alle 5 s)"
it = "Log delle prestazioni (ogni 5 s)"
pt = "Registro de desempenho (a cada 5 s)"
ja = "パフォーマンスログ（5秒ごと）"

["Writes one line every 5 seconds with the real FPS, the worst frame in the interval and whether the window has focus. The way to tell a real drop from an alt-tab: Windows halves the presentation of a visible unfocused window."]
fr = "Écrit une ligne toutes les 5 secondes avec les FPS réels, la pire image de l'intervalle et si la fenêtre a le focus. C'est le moyen de distinguer une vraie chute d'un alt-tab : Windows divise par deux la présentation d'une fenêtre visible mais sans focus."
de = "Schreibt alle 5 Sekunden eine Zeile mit den echten FPS, dem schlechtesten Bild im Intervall und ob das Fenster den Fokus hat. So erkennst du einen echten Einbruch von einem Alt-Tab: Windows halbiert die Darstellung eines sichtbaren, nicht fokussierten Fensters."
it = "Scrive una riga ogni 5 secondi con gli FPS reali, il fotogramma peggiore nell'intervallo e se la finestra ha il focus. Il modo per distinguere un vero calo da un alt-tab: Windows dimezza la presentazione di una finestra visibile ma senza focus."
pt = "Escreve uma linha a cada 5 segundos com os FPS reais, o pior quadro do intervalo e se a janela está com o foco. É a forma de distinguir uma queda real de um alt-tab: o Windows reduz pela metade a apresentação de uma janela visível sem foco."
ja = "5秒ごとに1行、実際のFPS、その間の最悪フレーム、ウィンドウがフォーカスされているかを書き込みます。実際の低下とAlt+Tabによるものを見分ける方法です。Windowsは、フォーカスのない表示中のウィンドウの描画を半分に抑えます。"

["Disk I/O log (every 5 s)"]
fr = "Journal des E/S disque (toutes les 5 s)"
de = "E/A-Protokoll der Festplatte (alle 5 s)"
it = "Log I/O disco (ogni 5 s)"
pt = "Registro de E/S de disco (a cada 5 s)"
ja = "ディスクI/Oログ（5秒ごと）"

["Writes one line every 5 seconds with AFS reads (count, MB, average/p95/p99 latency, worst and slow reads) plus one line per slow read. The way to tell whether a hitch comes from the disk."]
fr = "Écrit une ligne toutes les 5 secondes avec les lectures AFS (nombre, Mo, latence moyenne/p95/p99, lectures les plus lentes et lentes) plus une ligne par lecture lente. C'est le moyen de savoir si un saccadement vient du disque."
de = "Schreibt alle 5 Sekunden eine Zeile mit den AFS-Lesevorgängen (Anzahl, MB, mittlere/p95/p99-Latenz, langsamste und langsame Lesevorgänge) plus eine Zeile pro langsamem Lesevorgang. So erkennst du, ob ein Ruckler von der Festplatte kommt."
it = "Scrive una riga ogni 5 secondi con le letture AFS (numero, MB, latenza media/p95/p99, letture peggiori e lente) più una riga per ogni lettura lenta. Il modo per capire se uno scatto viene dal disco."
pt = "Escreve uma linha a cada 5 segundos com as leituras dos AFS (quantidade, MB, latência média/p95/p99, máximos e leituras lentas) e uma linha para cada leitura lenta. É a forma de ver se um travamento vem do disco."
ja = "5秒ごとに、AFSの読み取り（回数、MB、平均/p95/p99のレイテンシ、最大値、遅い読み取り）を1行で書き込み、遅い読み取りごとに1行追加します。カクつきがディスクによるものかを確認する方法です。"

["Disk readahead"]
fr = "Lecture anticipée du disque"
de = "Festplatten-Vorauslesen"
it = "Lettura anticipata del disco"
pt = "Leitura antecipada do disco"
ja = "ディスクの先読み"

["Reads bigger chunks at once and serves the following reads from RAM: helps on mechanical disks and during loads. Disabled automatically while mods are installed."]
fr = "Lit de plus gros blocs d'un coup et sert les lectures suivantes depuis la RAM : aide sur les disques mécaniques et pendant les chargements. Désactivé automatiquement tant que des mods sont installés."
de = "Liest größere Blöcke auf einmal und liefert die folgenden Lesevorgänge aus dem RAM: hilft bei mechanischen Festplatten und beim Laden. Wird automatisch deaktiviert, solange Mods installiert sind."
it = "Legge blocchi più grandi in una volta e serve le letture successive dalla RAM: aiuta sui dischi meccanici e durante i caricamenti. Disattivata automaticamente finché sono installate mod."
pt = "Lê blocos maiores de uma vez e serve as leituras seguintes da memória: ajuda em discos mecânicos e durante os carregamentos. Fica desativada automaticamente enquanto houver mods instalados."
ja = "一度により大きなブロックを読み込み、以降の読み取りはメモリから返します。HDDやロード時に効果があります。Modがインストールされている間は自動的に無効になります。"

["Texture dump for mods (dev)"]
fr = "Export des textures pour les mods (dev)"
de = "Texturen-Export für Mods (Dev)"
it = "Esportazione texture per le mod (dev)"
pt = "Exportação de texturas para mods (dev)"
ja = "Mod用テクスチャのダンプ（開発用）"

["Writes every unique texture as DDS + index.jsonl for authoring texture packs (PCSX2-style). It can take hundreds of MB: pick a folder with room. Development only; requires a restart and has no effect while HD texture enhancement is on."]
fr = "Écrit chaque texture unique en DDS + index.jsonl pour créer des packs de textures (style PCSX2). Peut prendre des centaines de Mo : choisis un dossier avec de la place. Réservé au développement ; nécessite un redémarrage et n'a aucun effet tant que l'amélioration des textures HD est activée."
de = "Schreibt jede einzigartige Textur als DDS + index.jsonl, um Textur-Pakete zu erstellen (im Stil von PCSX2). Kann hunderte MB belegen: Wähle einen Ordner mit genug Platz. Nur für die Entwicklung; erfordert einen Neustart und hat keine Wirkung, solange die HD-Texturverbesserung aktiv ist."
it = "Scrive ogni texture unica come DDS + index.jsonl per creare pacchetti texture (stile PCSX2). Può occupare centinaia di MB: scegli una cartella con spazio. Solo per sviluppo; richiede un riavvio e non ha effetto finché il miglioramento texture HD è attivo."
pt = "Grava cada textura única como DDS + index.jsonl para criar pacotes de texturas (estilo PCSX2). Pode ocupar centenas de MB: escolha uma pasta com espaço. Somente para desenvolvimento; exige reiniciar e não tem efeito com a melhoria de texturas HD ativada."
ja = "ユニークなテクスチャをすべてDDS + index.jsonlとして書き出し、テクスチャパックの作成に使えるようにします（PCSX2方式）。数百MBになることがあるため、空き容量のあるフォルダを選んでください。開発用のみで、再起動が必要です。HDテクスチャ強化が有効な間は効果がありません。"

