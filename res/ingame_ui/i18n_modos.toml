["Your settings could not be read (the file is damaged), so the defaults are in use. Press 'Repair install' below to start with clean settings: your old file is kept aside, not lost."]
fr = "Tes réglages n'ont pas pu être lus (fichier endommagé), les valeurs par défaut sont donc utilisées. Appuie sur « Réparer l'installation » ci-dessous pour repartir de réglages propres : ton ancien fichier est mis de côté, pas perdu."
