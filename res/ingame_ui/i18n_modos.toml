["A part of the game is missing (.so libraries next to dbz3). Extract the full .tar.gz package again into a new folder and copy your mods and user_data folders (your saves) there."]
fr = "Une partie du jeu manque (bibliothèques .so à côté de dbz3). Extrais à nouveau le paquet .tar.gz complet dans un nouveau dossier et copie-y tes dossiers mods et user_data (tes sauvegardes)."
de = "Ein Teil des Spiels fehlt (.so-Bibliotheken neben dbz3). Entpacke das komplette .tar.gz-Paket erneut in einen neuen Ordner und kopiere dort deine Ordner mods und user_data (deine Spielstände)."
it = "Manca una parte del gioco (librerie .so accanto a dbz3). Estrai di nuovo il pacchetto .tar.gz completo in una nuova cartella e copiaci le cartelle mods e user_data (i tuoi salvataggi)."
pt = "Parte do jogo está faltando (bibliotecas .so ao lado de dbz3). Extraia o pacote .tar.gz completo de novo em uma pasta nova e copie para lá suas pastas mods e user_data (seus saves)."
ja = "ゲームの一部（dbz3の隣にある.soライブラリ）が不足しています。完全な.tar.gzパッケージを新しいフォルダに展開し直し、modsフォルダとuser_dataフォルダ（セーブデータ）をそこにコピーしてください。"
