pt = "os arquivos do jogo ou as DLLs são diferentes: ambos devem extrair o mesmo pacote completo no mesmo sistema operacional"
ja = "ゲームファイルまたはDLLが異なります。同じOSで、両者とも同じ配布パッケージをすべて展開してください"

["the online protocol differs: both players must update to the same game package"]
es = "el protocolo online es distinto: actualizad los dos al mismo paquete del juego"
en = "the online protocol differs: both players must update to the same game package"
fr = "le protocole en ligne diffère : mettez tous les deux le jeu à jour avec le même paquet"
de = "Das Online-Protokoll unterscheidet sich: Beide müssen auf dasselbe Spielpaket aktualisieren"
