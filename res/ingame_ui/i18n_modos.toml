# solNET 1.5.6.1: motivos de conexion y registro enviable.
["the game files or DLLs differ: both players must extract the same complete package on the same operating system"]
es = "los archivos del juego o sus DLL son distintos: extraed los dos el mismo paquete completo, en el mismo sistema"
en = "the game files or DLLs differ: both players must extract the same complete package on the same operating system"
fr = "les fichiers du jeu ou les DLL diffèrent : vous devez tous les deux extraire le même paquet complet sur le même système"
de = "Spieldateien oder DLLs unterscheiden sich: Beide müssen dasselbe vollständige Paket auf demselben Betriebssystem entpacken"
