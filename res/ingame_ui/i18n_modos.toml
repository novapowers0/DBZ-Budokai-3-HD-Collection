["Writes one line every 5 seconds with the real FPS, the worst frame in the interval and whether the window has focus. The way to tell a real drop from an alt-tab: Windows halves the presentation of a visible unfocused window."]
fr = "Écrit une ligne toutes les 5 secondes avec les FPS réels, la pire image de l'intervalle et si la fenêtre a le focus. C'est le moyen de distinguer une vraie chute d'un alt-tab : Windows divise par deux la présentation d'une fenêtre visible mais sans focus."
de = "Schreibt alle 5 Sekunden eine Zeile mit den echten FPS, dem schlechtesten Bild im Intervall und ob das Fenster den Fokus hat. So erkennst du einen echten Einbruch von einem Alt-Tab: Windows halbiert die Darstellung eines sichtbaren, nicht fokussierten Fensters."
it = "Scrive una riga ogni 5 secondi con gli FPS reali, il fotogramma peggiore nell'intervallo e se la finestra ha il focus. Il modo per distinguere un vero calo da un alt-tab: Windows dimezza la presentazione di una finestra visibile ma senza focus."
pt = "Escreve uma linha a cada 5 segundos com os FPS reais, o pior quadro do intervalo e se a janela está com o foco. É a forma de distinguir uma queda real de um alt-tab: o Windows reduz pela metade a apresentação de uma janela visível sem foco."
ja = "5秒ごとに1行、実際のFPS、その間の最悪フレーム、ウィンドウがフォーカスされているかを書き込みます。実際の低下とAlt+Tabによるものを見分ける方法です。Windowsは、フォーカスのない表示中のウィンドウの描画を半分に抑えます。"

["Disk I/O log (every 5 s)"]
