["Choose what to prioritize. Performance = smoothest on modest PCs; Balanced = good image at low cost; Quality = best image without maxing out the GPU. Automatic detects your GPU and picks for you. None raises the internal scale (supersampling is set separately, below). The controls below are only touched in Custom."]
fr = "Choisis ce qu'il faut privilégier. Performance = le plus fluide sur les PC modestes ; Équilibré = bonne image à faible coût ; Qualité = meilleure image sans pousser la carte graphique à fond. Automatique détecte ta carte graphique et choisit pour toi. Aucun augmente l'échelle interne (le supersampling se règle à part, ci-dessous). Les réglages ci-dessous ne changent qu'en Personnalisé."
de = "Wähle, was Vorrang haben soll. Leistung = am flüssigsten auf schwachen PCs; Ausgewogen = gutes Bild bei geringem Aufwand; Qualität = bestes Bild, ohne die Grafikkarte voll auszulasten. Automatisch erkennt deine Grafikkarte und wählt für dich. Keine erhöht die interne Skalierung (Supersampling wird separat eingestellt, unten). Die folgenden Einstellungen werden nur im Modus Benutzerdefiniert verändert."
it = "Scegli cosa privilegiare. Prestazioni = il più fluido sui PC modesti; Bilanciato = buona immagine a basso costo; Qualità = la migliore immagine senza saturare la GPU. Automatico rileva la tua GPU e sceglie per te. Nessuno alza la scala interna (il supersampling si imposta a parte, sotto). I comandi sotto vengono toccati solo in Personalizzato."
pt = "Escolha o que priorizar. Desempenho = o mais fluido em PCs modestos; Equilibrado = boa imagem com pouco custo; Qualidade = a melhor imagem sem sobrecarregar a GPU. Automático detecta sua GPU e escolhe por você. Nenhum aumenta a escala interna (o supersampling é ajustado à parte, abaixo). Os controles abaixo só são alterados em Personalizado."
ja = "優先する設定を選んでください。パフォーマンス＝性能の低いPCでも最もスムーズ、バランス＝低負荷で良好な画質、クオリティ＝GPUに負担をかけずに最高の画質。自動はGPUを検出して自動的に選びます。なしは内部解像度を上げません（スーパーサンプリングは下で別途設定）。以下の項目はカスタムのときだけ変更されます。"

