["1. Turn on 'Capture textures' and play until you see what you want to change.\n2. Press 'Prepare PNGs' and open the folder: they are sorted by size.\n3. Edit any PNG WITHOUT renaming it (it can be 2, 3 or 4 times bigger) and save it in 'My texture pack'.\n4. Play: it is applied automatically. To remove it, disable the pack in the list below."]
es = "1. Activa 'Capturar texturas' y juega hasta ver lo que quieres cambiar.\n2. Pulsa 'Preparar PNG' y abre la carpeta: estan ordenados por tamano.\n3. Edita el PNG que quieras SIN cambiarle el nombre (puede ser 2, 3 o 4 veces mas grande) y guardalo en 'Mi pack de texturas'.\n4. Juega: se aplica solo. Para quitarlo, desactiva el pack en la lista de abajo."
en = "1. Turn on 'Capture textures' and play until you see what you want to change.\n2. Press 'Prepare PNGs' and open the folder: they are sorted by size.\n3. Edit any PNG WITHOUT renaming it (it can be 2, 3 or 4 times bigger) and save it in 'My texture pack'.\n4. Play: it is applied automatically. To remove it, disable the pack in the list below."
fr = "1. Active « Capturer les textures » et joue jusqu'à voir ce que tu veux changer.\n2. Appuie sur « Préparer les PNG » et ouvre le dossier : ils sont triés par taille.\n3. Modifie n'importe quel PNG SANS le renommer (il peut faire 2, 3 ou 4 fois plus grand) et enregistre-le dans « Mon pack de textures ».\n4. Joue : il s'applique tout seul. Pour le retirer, désactive le pack dans la liste ci-dessous."
de = "1. Aktiviere 'Texturen erfassen' und spiele, bis du siehst, was du ändern willst.\n2. Drücke 'PNGs vorbereiten' und öffne den Ordner: Sie sind nach Größe sortiert.\n3. Bearbeite ein beliebiges PNG OHNE es umzubenennen (es darf 2, 3 oder 4 Mal so groß sein) und speichere es in 'Mein Textur-Pack'.\n4. Spiele: Es wird automatisch angewendet. Zum Entfernen deaktiviere das Pack in der Liste unten."
it = "1. Attiva 'Cattura texture' e gioca finché vedi ciò che vuoi cambiare.\n2. Premi 'Prepara PNG' e apri la cartella: sono ordinati per dimensione.\n3. Modifica un qualsiasi PNG SENZA rinominarlo (può essere 2, 3 o 4 volte più grande) e salvalo in 'Il mio pacchetto texture'.\n4. Gioca: viene applicato automaticamente. Per rimuoverlo, disattiva il pacchetto nell'elenco qui sotto."
pt = "1. Ative 'Capturar texturas' e jogue até ver o que quer mudar.\n2. Pressione 'Preparar PNG' e abra a pasta: eles estão ordenados por tamanho.\n3. Edite o PNG que quiser SEM mudar o nome dele (pode ser 2, 3 ou 4 vezes maior) e salve em 'Meu pacote de texturas'.\n4. Jogue: ele é aplicado sozinho. Para remover, desative o pacote na lista abaixo."
ja = "1. 「テクスチャをキャプチャ」を有効にし、変えたいものが見えるまでプレイします。\n2. 「PNGを準備」を押してフォルダを開きます。サイズ順に並んでいます。\n3. 名前を変えずに編集したいPNGを編集し（2倍、3倍、4倍の大きさでも可）、「マイテクスチャパック」に保存します。\n4. プレイすると自動で適用されます。削除するには、下のリストでパックを無効にしてください。"

