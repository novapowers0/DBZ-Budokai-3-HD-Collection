["This adds NEW characters to the game (from Budokai 1, 2, Infinite World or the community). You don't need anything here to play. Imported characters are experimental: some technique, animation or effect may not be perfect."]
fr = "Cela ajoute de NOUVEAUX personnages au jeu (venant de Budokai 1, 2, Infinite World ou de la communauté). Tu n'as besoin de rien ici pour jouer. Les personnages importés sont expérimentaux : une technique, une animation ou un effet peut ne pas être parfait."
de = "Das fügt NEUE Charaktere zum Spiel hinzu (aus Budokai 1, 2, Infinite World oder der Community). Du brauchst hier nichts, um zu spielen. Importierte Charaktere sind experimentell: Eine Technik, Animation oder ein Effekt kann unvollkommen sein."
it = "Questo aggiunge NUOVI personaggi al gioco (da Budokai 1, 2, Infinite World o dalla community). Per giocare non serve nulla qui. I personaggi importati sono sperimentali: qualche tecnica, animazione o effetto potrebbe non essere perfetto."
pt = "Aqui são adicionados personagens NOVOS ao jogo (de Budokai 1, 2, Infinite World ou da comunidade). Não é preciso mexer em nada disto para jogar. Os personagens importados são experimentais: alguma técnica, animação ou efeito pode não ficar perfeito."
ja = "ここではゲームに新しいキャラクターを追加できます（Budokai 1、2、Infinite World、またはコミュニティ製）。遊ぶだけならここは触らなくて構いません。インポートしたキャラクターは実験的なもので、一部の技・アニメーション・エフェクトが完璧でない場合があります。"

["If something goes wrong: untick the character under \"Installed\" (back to how it was) and press PLAY. Your saves are never touched."]
fr = "Si quelque chose ne va pas : décoche le personnage dans « Installés » (retour à l'état d'origine) et appuie sur JOUER. Tes sauvegardes ne sont jamais touchées."
de = "Wenn etwas schiefgeht: Entferne bei dem Charakter unter 'Installiert' den Haken (zurück zum alten Zustand) und drücke SPIELEN. Deine Spielstände werden nie angerührt."
it = "Se qualcosa va storto: togli la spunta al personaggio sotto 'Installati' (torna com'era) e premi GIOCA. I tuoi salvataggi non vengono mai toccati."
pt = "Se algo der errado: desmarque o personagem em \"Instalados\" (volta ao que era) e aperte JOGAR. Seus saves não são alterados."
ja = "問題が起きたら: 「インストール済み」でキャラクターのチェックを外し（元に戻ります）、プレイを押してください。セーブデータは一切変更されません。"

["New characters (extra select cells)"]
fr = "Nouveaux personnages (cases supplémentaires de sélection)"
de = "Neue Charaktere (zusätzliche Auswahlfelder)"
it = "Nuovi personaggi (celle di selezione extra)"
pt = "Novos personagens (casas extras na seleção)"
ja = "新しいキャラクター（選択画面の追加枠）"

["Adds characters in NEW select-wheel cells without replacing anyone. Each one is a mod with its model; the icon, name banner and portraits are generated in the game's style. It uses a \"donor\" character's moveset (or its own if it is a port) and can have its own capsules."]
fr = "Ajoute des personnages dans de NOUVELLES cases de la roue de sélection, sans remplacer personne. Chacun est un mod avec son modèle ; l'icône, la bannière de nom et les portraits sont générés dans le style du jeu. Il utilise le moveset d'un personnage « donneur » (ou le sien si c'est un port) et peut avoir ses propres capsules."
de = "Fügt Charaktere in NEUE Felder des Auswahlrads hinzu, ohne jemanden zu ersetzen. Jeder ist ein Mod mit eigenem Modell; Symbol, Namensbanner und Porträts werden im Stil des Spiels erzeugt. Er verwendet das Moveset eines 'Spender'-Charakters (oder sein eigenes, wenn es ein Port ist) und kann eigene Kapseln haben."
it = "Aggiunge personaggi in NUOVE celle della ruota di selezione senza sostituire nessuno. Ognuno è una mod con il suo modello; icona, banner del nome e ritratti sono generati nello stile del gioco. Usa il moveset di un personaggio 'donatore' (o il suo, se è un port) e può avere capsule proprie."
pt = "Adiciona personagens em casas NOVAS da roda de seleção, sem substituir ninguém. Cada um é um mod com seu modelo; o ícone, o rótulo e os retratos são gerados sozinhos no estilo do jogo. Usa o moveset de um personagem \"doador\" (ou o próprio, se for um port) e pode ter suas próprias cápsulas."
ja = "既存のキャラクターを置き換えず、選択ホイールの新しい枠に追加します。各キャラクターはモデル付きのModで、アイコン・ネームプレート・肖像はゲームのスタイルで自動生成されます。ドナーキャラクターの技セット（移植の場合は自身の技）を使い、独自のカプセルを持たせることもできます。"

["Steps: 1) check the free slots, 2) enable or pick a character to edit it, 3) create a new one below. Everything applies automatically on PLAY."]
fr = "Étapes : 1) vérifie les emplacements libres, 2) active ou choisis un personnage pour le modifier, 3) crée un nouveau personnage plus bas. Tout s'applique automatiquement en appuyant sur JOUER."
de = "Schritte: 1) freie Slots prüfen, 2) einen Charakter aktivieren oder auswählen, um ihn zu bearbeiten, 3) unten einen neuen erstellen. Alles wird beim Drücken von SPIELEN automatisch übernommen."
it = "Passaggi: 1) controlla gli slot liberi, 2) attiva o scegli un personaggio per modificarlo, 3) creane uno nuovo qui sotto. Tutto si applica automaticamente premendo GIOCA."
pt = "Passos: 1) veja as casas livres, 2) ative ou escolha um personagem para editar, 3) crie um novo abaixo. Tudo é aplicado automaticamente ao clicar em JOGAR."
ja = "手順: 1) 空き枠を確認する 2) 編集するキャラクターを有効にするか選ぶ 3) 下で新しいキャラクターを作成する。すべてプレイを押したときに自動的に適用されます。"

