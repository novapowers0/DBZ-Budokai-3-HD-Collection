name: macOS build (experimental)

# Apple Silicon (arm64) build through MoltenVK. Nobody on the team has a Mac:
# it is compiled and packaged here, never run. Released as "experimental, untested".
on:
  workflow_dispatch:
  push:
    branches: [master, mac-build]
    paths:
      - 'src/**'
      - 'generated/**'
      - 'generated_eu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'patches/**'
      - '.github/workflows/mac.yml'

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - name: Check out public project
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version=$(grep -oE 'DBZ3_VERSION_STR[[:space:]]+"[^"]+"' src/version.rc \
            | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out private generated code
        uses: actions/checkout@v4
        with:
          repository: novapowers0/DBZ-Budokai-3-HD-Collection-generated
          ssh-key: ${{ secrets.DBZ3_GENERATED_SSH_KEY }}
          path: generated-private

      - name: Install build dependencies
        run: |
          brew install ninja
          cmake --version
          clang++ --version

      - name: Check out ReXGlue SDK
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: v0.10.0
          path: rexglue-sdk-0.10
          submodules: recursive

      - name: Apply project runtime patches
        shell: bash
        run: |
          cp -a patches/rexglue-sdk/. rexglue-sdk-0.10/
          bash tools/patch_rexglue_linux.sh

      - name: Validate generated source set
        shell: bash
        run: |
          test -f generated-private/us/sources.cmake
          test -f generated-private/eu/sources.cmake
          rm -rf generated generated_eu
          cp -a generated-private/us generated
          cp -a generated-private/eu generated_eu

      - name: Build and install ReXGlue SDK
        run: |
          cmake --preset mac-arm64 -S rexglue-sdk-0.10 \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/rexglue-mac"
          cmake --build rexglue-sdk-0.10/out/build/mac-arm64 --config Release --parallel
          cmake --install rexglue-sdk-0.10/out/build/mac-arm64 --config Release

      - name: Configure and build dbz3
        run: |
          cmake -S . -B out/build/mac-arm64-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_CXX_FLAGS="-march=armv8-a" \
            -DDBZ3_DUAL_REGION=ON \
            -DREXGLUE_USE_D3D12=OFF -DREXGLUE_USE_VULKAN=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/rexglue-mac"
          cmake --build out/build/mac-arm64-release --parallel

      - name: Show build outputs
        run: |
          file out/build/mac-arm64-release/dbz3
          find out/build/mac-arm64-release rexglue-mac -maxdepth 3 \( -name '*.dylib' -o -name '*.json' -o -name 'dbz3' \) | head -40
          otool -L out/build/mac-arm64-release/dbz3

      - name: Package macOS release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/mods
          cp out/build/mac-arm64-release/dbz3 package/dbz3
          # Runtime libraries next to the game (rexruntime from the SDK install, the GPU backend and
          # MoltenVK/Vulkan loader from whichever tree produced them).
          for pat in 'librexruntime*.dylib' 'librexgpu-xenos*.dylib' 'libMoltenVK*.dylib' 'libvulkan*.dylib'; do
            find out/build/mac-arm64-release rexglue-mac rexglue-sdk-0.10/out/build/mac-arm64 \
              -name "$pat" \( -type f -o -type l \) -print 2>/dev/null | while read -r f; do cp -L "$f" package/; done
          done
          icd=$(find rexglue-mac rexglue-sdk-0.10 -name 'MoltenVK_icd.json' -print -quit || true)
          if [ -n "$icd" ]; then
            mkdir -p package/vulkan/icd.d
            sed 's#"library_path": *"[^"]*"#"library_path": "../../libMoltenVK.dylib"#' "$icd" > package/vulkan/icd.d/MoltenVK_icd.json
          fi
          install_name_tool -add_rpath @executable_path package/dbz3 || true
          for f in package/*.dylib; do install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true; done
          # Ad-hoc signature: arm64 binaries must be signed to run at all after install_name_tool.
          codesign --force -s - package/*.dylib package/dbz3
          cp README.md README_EN.md baserom.md gamecontrollerdb.txt package/
          cat > package/README_MAC.txt <<'EOF'
          EXPERIMENTAL - UNTESTED. This macOS build (Apple Silicon, M1 or newer) is compiled automatically;
          nobody on the team has a Mac, so it has never been run. Please report what happens on GitHub.

          1. Put your legally dumped default.xex and us/ or eu/ next to dbz3 (as on Linux).
          2. macOS blocks downloaded programs: open Terminal in this folder and run
               xattr -dr com.apple.quarantine .
               ./dbz3
          3. If it fails, attach the newest file in logs/ and everything Terminal printed.
          EOF
          test -f package/dbz3
          ls -la package
          tar -C package -czf "DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-macos-arm64-EXPERIMENTAL.tar.gz" .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-macos-arm64-EXPERIMENTAL
          path: DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-macos-arm64-EXPERIMENTAL.tar.gz

      - name: Attach macOS package to release
        if: startsWith(github.ref, 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          file="DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-macos-arm64-EXPERIMENTAL.tar.gz"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "No release $tag yet; skipping asset upload."
          fi
