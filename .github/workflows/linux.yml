name: Linux build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'generated/**'
      - 'generated_eu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/linux.yml'

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out public project
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          # Single source of truth: src/version.rc (DBZ3_VERSION_STR "x.y.z")
          version=$(grep -oE 'DBZ3_VERSION_STR[[:space:]]+"[^"]+"' src/version.rc \
            | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Check out private generated code
        uses: actions/checkout@v4
        with:
          repository: novapowers0/DBZ-Budokai-3-HD-Collection-generated
          ssh-key: ${{ secrets.DBZ3_GENERATED_SSH_KEY }}
          path: generated-private

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates cmake ninja-build pkg-config \
            libvulkan-dev vulkan-tools libx11-xcb-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev wayland-protocols libasound2-dev libpulse-dev \
            libpipewire-0.3-dev unzip zenity patchelf binutils
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 libc++-18-dev libc++abi-18-dev

      - name: Check out ReXGlue SDK
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: v0.10.0
          path: rexglue-sdk-0.10
          submodules: recursive

      - name: Apply project runtime patches
        shell: bash
        run: |
          cp -a patches/rexglue-sdk/. rexglue-sdk-0.10/
          bash tools/patch_rexglue_linux.sh
          grep -n -A3 'namespace std::chrono' rexglue-sdk-0.10/include/rex/chrono/chrono.h

      - name: Validate generated source set
        shell: bash
        run: |
          test -f generated-private/us/sources.cmake
          test -f generated-private/eu/sources.cmake
          rm -rf generated generated_eu
          cp -a generated-private/us generated
          cp -a generated-private/eu generated_eu

      - name: Build and install ReXGlue SDK
        run: |
          cmake --preset linux-amd64 -S rexglue-sdk-0.10 \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2 -stdlib=libc++ -pthread" \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/rexglue-linux"
          cmake --build rexglue-sdk-0.10/out/build/linux-amd64 --config Release --parallel
          cmake --install rexglue-sdk-0.10/out/build/linux-amd64 --config Release

      - name: Configure and build dbz3
        run: |
          cmake --preset linux-amd64-release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2 -stdlib=libc++ -pthread" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/rexglue-linux"
          cmake --build out/build/linux-amd64-release --config Release --parallel

      - name: Test Linux environment summary (reads the real /etc/os-release of the runner)
        run: |
          clang++-18 -std=c++20 -stdlib=libc++ -Isrc/launcher tests/linux_env_test.cpp -o linux_env_test
          ./linux_env_test tests/linux_env_data
          # Same function on the runner's own files: prints what a player's log will contain.
          printf '%s\n' '#include "linux_env.h"' '#include <cstdio>' \
            'int main() { std::puts(dbz3::launcher::LinuxEnvSummary().c_str()); }' > linux_env_real.cpp
          clang++-18 -std=c++20 -stdlib=libc++ -Isrc/launcher linux_env_real.cpp -o linux_env_real
          ./linux_env_real

      - name: Smoke-check ELF outputs
        run: |
          file out/build/linux-amd64-release/dbz3
          test -x out/build/linux-amd64-release/dbz3
          test -n "$(find rexglue-linux -name 'librexruntime.so*' \
            \( -type f -o -type l \) -print -quit)"
          test -f out/build/linux-amd64-release/librexgpu-xenos.so

      - name: Package Linux release
        run: |
          mkdir -p package/mods
          cp out/build/linux-amd64-release/dbz3 package/dbz3
          # rexruntime is installed by the SDK, not staged beside the game.
          # Copying only the game's *.so files silently produced a package
          # that passed the ELF smoke check but could not start on Linux.
          runtime=$(find rexglue-linux -name 'librexruntime.so*' \
            \( -type f -o -type l \) -print -quit)
          cp -L "$runtime" package/librexruntime.so
          cp out/build/linux-amd64-release/librexgpu-xenos.so* package/
          # The CI toolchain is libc++/libunwind 18. Bundle those exact ABI
          # libraries so Arch/CachyOS does not need the Ubuntu SONAME .so.1.
          for lib in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            found=$(find /usr/lib/llvm-18/lib /usr/lib/x86_64-linux-gnu \
              -name "$lib" \( -type f -o -type l \) -print -quit)
            test -n "$found"
            cp -L "$found" package/
          done
          patchelf --set-rpath '$ORIGIN' package/dbz3 package/*.so*
          cp README.md README_EN.md baserom.md package/
          # SDL game-controller mappings: the repair check and the SDL input backend look for this file next to dbz3.
          cp gamecontrollerdb.txt package/
          cat > package/README_LINUX.txt <<'EOF'
          Place your legally dumped default.xex and us/ or eu/ next to dbz3.

          Vulkan driver required (Mesa RADV/ANV or the NVIDIA proprietary driver).

          If something fails, please attach to the GitHub issue:
            1. The newest file in the logs/ folder (it is created in the folder the game was started from,
               normally next to dbz3). The log already lists your distro, kernel, desktop session and
               whether Steam/Flatpak is used.
            2. The output of: vulkaninfo --summary
            3. Whether it also happens on the intro video and on other story endings.
          Starting the game from a terminal (./dbz3) also prints driver messages that the log does not keep.
          EOF
          # Validate the packaged layout, not merely the build directory.
          test -f package/librexruntime.so
          test -f package/librexgpu-xenos.so
          readelf -d package/dbz3 | grep -E 'RPATH|RUNPATH' | grep '\$ORIGIN'
          tar -C package -czf "DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-linux-amd64
          path: DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz

      - name: Attach Linux package to release
        if: startsWith(github.ref, 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          file="DBZ-Budokai-3-HD-Collection-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz"
          # Only attach when the release for this version exists; never create it here.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            echo "Attached $file to release $tag"
          else
            echo "No release $tag yet; skipping asset upload (artifact retained above)."
          fi
