# Dragon Tactics H5: catalogo de capsulas. Cada unidad lleva hasta 2. Numeros NUESTROS y PROVISIONALES (equilibrio: tests/tactics_equilibrio.cpp).
# Los carga y valida src/tactics/partida.cpp (CargarEconomia, junto a tactics_economia.toml); la descripcion que ve el jugador se
# genera de estos mismos numeros, asi que nunca puede contradecirlos. Todo en %, salvo alcance (casillas); se suma con las sinergias.
