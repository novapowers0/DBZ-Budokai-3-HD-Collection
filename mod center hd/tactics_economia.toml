# TACTICS-04: bots listos (solo si esta encendido "Tácticas: bots listos" en F1 > Modos; apagado de serie). Cada bot tiene un objetivo de partida:
# una sinergia (sale de la semilla) y, el `estrellas` % de ellos, ademas llegar a 3 estrellas. Puntos que el bot suma a una carta:
# objetivo = es de su sinergia objetivo; copia3 = por cada pieza suya de 2 estrellas de esa unidad (camino a 3); sinergia = completa un tramo de
# una sinergia suya (la mitad si solo suma un miembro); rival = resta por cada copia de esa unidad en manos de los rivales vivos.
# ahorro_desde = ronda desde la que guarda oro para el interes (con el tablero lleno). Los de 3 estrellas, con una unidad a 2 estrellas, "cazan":
# venden una suelta del banquillo si no cabe la copia, con el tablero lleno solo compran copias y actualizan la tienda hasta `tiradas` veces.
# Medido (tactics_equilibrio ... 0 1, 1500 torneos): algun bot a 3 estrellas en el 21 % de las partidas en Normal; puesto medio del piloto
# 1,27 / 1,98 / 2,68 en Facil / Normal / Dificil.
[bots]
objetivo = 20
copia3 = 60
sinergia = 20
rival = 4
ahorro_desde = 4
tiradas = 2
estrellas = 25

# TACTICS-05: variedad de composiciones (solo si esta encendido "Tácticas: variedad" en F1 > Modos; apagado de serie no cambia nada ni la huella).
