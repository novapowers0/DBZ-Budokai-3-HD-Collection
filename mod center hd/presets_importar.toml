# Presets de importacion (importar.py --preset NOMBRE [--opcion clave=valor ...]).
#
# Un preset dice de donde sale cada parte del personaje importado. "original" respeta el juego
# de origen todo lo que el puerto sabe portar; "solo_modelos" deja el cuerpo nuevo con todo lo
# demas del donante de Budokai 3. Cualquier opcion se cambia al crear el personaje (Kit,
# launcher o --opcion), y despues en su personaje.toml.
#
# Opciones:
#   golpes  = "fuente" | "donante"        moveset, camara, tecnicas y definitiva
#   voces   = "fuente" | "donante" | "ninguna"
#   fisica  = "auto" | "donante" | "ninguna"   pelo y colas con la fisica del donante
#   altura  = true | false                pies al suelo (cadera ajustada a las piernas)
#   pose_select = true | false            pose del select sacada de su moveset
#   combos_tecnica = true | false         tecnicas al final de los combos, como el donante

[b1.original]
descripcion = "Budokai 1: golpes, combos, gritos y definitiva de B1 sobre el cuerpo del donante (B1 no tiene frases: solo sus gritos de combate)"
golpes = "fuente"
voces = "fuente"
fisica = "auto"

[b1.solo_modelos]
descripcion = "Budokai 1: solo el modelo; golpes, tecnicas y voz del donante"
golpes = "donante"
voces = "donante"

[b2.original]
descripcion = "Budokai 2: golpes y combos de B2 sobre el cuerpo del donante (tecnicas, definitiva y voz del donante)"
