# La historia de Freezer en Dragon Universe. El juego ya traia su casilla (22) con la
# introduccion de Namek ("El malvado Freezer...") y 14 combates de Freezer sin usar
# (data_cmn 654-667: Vegeta, Piccolo, Goku, Krilin, Gohan, Trunks), pero se quedo fuera de la
# rueda y sin escenas. Este mod la completa: la casilla en la rueda, el paso de la introduccion
# a la historia, dos sagas (Namek y la Tierra) con 12 combates y sus dialogos, y un final propio.
# Montar: python campana.py montar campanas/historia_freezer.toml
[campana]
nombre = "Historia de Freezer (Dragon Universe)"
mod = "historia_freezer"
descripcion = "Recupera la historia de Freezer que se quedo fuera del juego: elige a Freezer en Dragon Universe."

[rueda]
personajes = [27]

# La introduccion de Namek de Freezer (codigo 102, entrada 22) no preparaba el mapa: se rehace con
# la de Goku en Namek (entrada 0: posicion de salida, Bolas de Dragon y objetos del mapa, con la
# nave de Freezer visible) y la marca del primer combate (como la introduccion de Goku).
[[escena]]
contenedor = 1725
entrada = 22
cabecera = [9, 3, 4, 2, 0, 0, 2779]
cambiar = [
  [10, 0, 4520], [10, 1, 66197], [10, 2, 66197], [13, 0, 135269],
  [11, 0, 1414], [12, 0, 1415], [11, 1, 1414], [12, 1, 1415],
  [14, 1, 132303], [14, 2, 132304], [14, 3, 132305],
  [22, 0, 0],
  [44, 0, 4918, -4416, 600], [54, 0, 0],   # salida apartada de la marca (como las del juego)
  [24, 6, "2100.0", 2688, 9, -6214, 15, 5477, 1000], [35, 0, "2100.0", 479],
  [24, 7, "2100.1", 2688, 9, -3010, 15, -4781, 1000], [35, 1, "2100.1", 492],
  [24, 8, "2100.2", 2688, 9, -537, 15, 2474, 1000], [35, 2, "2100.2", 479],
  [24, 9, "2100.8", 2688, 9, 6907, 15, 3096, 1000], [35, 3, "2100.8", 479],
  [24, 10, "2100.3", 176, 9, 4799, 15, -6998, 1000],
  [24, 11, "2100.4", 176, 9, -5788, 25, -2764, 1000],
  [24, 12, "2100.6", 2688, 9, 4577, 15, -2237, 1000],
  [29, 0, "SAITYOU", 1], [29, 0, "SAITYOUHAKAI", 0], [29, 0, "VEGE", 0], [29, 0, "VEGEHAKAI", 1],
  [29, 0, "NAIL", 1], [29, 0, "NAILHAKAI", 0], [29, 0, "COOL", 0], [29, 0, "COOLHAKAI", 0],
  [29, 0, "COOLNASI", 1], [29, 0, "FSS", 1], [29, 0, "FSSGIN", 1], [29, 0, "FSSGINHAKAI", 0],
  [29, 0, "GSS", 1], [29, 0, "BRUMA", 1], [29, 0, "BRUMAHAKAI", 0],
  [24, 0, "5522.0", 1, 2, 4918, 67, -4916, 1000],
  [20, 0, "5122.0"]]   # como el juego (102.0 -> 5100.0): a la llegada al mapa (escena 0 del mapa de la saga); sin ella Freezer salia a ras del agua

# Imagen del anime en la introduccion (entrada libre de data_cmn; la escena de arriba la usa).
[[imagen]]
entrada = 4520
archivo = "imagenes/dragon-ball-reveals-original-90s-freiza-artwork-from-rare-dbz-release-3-1.avif"

# Como las historias del juego: cada combate con su dialogo antes y despues; el panel solo al
# abrir y cerrar cada saga.
[historia]
codigo = 5122
contenedor = 1820
eventos_mapa = { codigos = [2100], retrato = 1463, desde = 4600 }   # "I found something!" con la cara de Freezer
traje_mapa = 2                 # en el mapa de Namek Freezer va en su nave (traje 3 del juego: modelo 193)
altura_mapa = 600            # altura a la que vuelas por el mapa al volver de un combate
# cada idioma con su texto (`_es`, `_en`...); los que no tienen el suyo (fr/de/it) usan el ingles
# textos: campana.py reserva solo su bloque de entradas (sin `textos_desde`), sin pisar otros mods
fondo = 1411                 # el panel verde de la introduccion de Freezer
final = { contenedor = 1728, codigo = 1, entrada = 39, fondo = "villano" }   # entrada de final libre; fondo "villano" (Broly) o "heroe"
combates = { codigo = 5522, contenedor = 2132, plantilla = 709 }   # plantilla: Goku en Namek (escenario de Namek)
# dialogo en el escenario al empezar cada combate (rival a la izquierda, Freezer a la derecha)
dialogos = { codigo = 5922, contenedor = 1659 }   # sus combates (bloque de combates de Freezer, de relleno)

# El panel traia una etiqueta de pruebas en japones arriba ("23 Saga de Freezer..."): fuera.
# Retratos de Freezer 2.a y 3.a forma (1464, 1465): el juego los tiene sin terminar (una textura de
# las dos) y cuelgan el dialogo; se reparan con su propia imagen.
