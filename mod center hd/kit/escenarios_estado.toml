# Estado de cada escenario de Budokai 2 / Budokai 1 (PS2) para el asistente «Nuevo escenario» del Kit (KIT-07).
# Se puede actualizar sin tocar codigo. Fuente: docs/14_frentes/escenarios.md §5 (11/11/2026).
#   estado: "probado" (selector + combate en el juego) | "sin_probar" | "no_funciona" (sale apagado, no se elige)
#   zona_b: el escenario tiene segunda zona (B2: grupos 0, 4, 7 y 8; escenarios_convertir.py --zona b)
#   corto:  nombre que se propone para el selector cuando `es` pasa de 15 letras
#   foto_girada: la foto del Kit sale boca abajo (camara de la foto, no el escenario): la casilla la gira 180 grados
# Nombres: los que se ven en la foto (no son los oficiales del juego de origen).

[[escenario]]
juego = "b2"
grupo = 0
es = "Base militar"
en = "Military base"
estado = "sin_probar"
zona_b = true

