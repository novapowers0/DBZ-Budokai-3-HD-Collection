descripcion = "modos_rogue_jefe_pisos (ROG-01): Dragon Rogue, El Abismo de 15 pisos con el jefe cada 5 de verdad: los combates 5, 10 y 15 piden armadura 50 %, 60 % (gigante, tormenta) y 70 % (aguantar 45 s); aviso de jefe antes de cada uno y final con 15 pisos"
# Se elige siempre la carta del medio; no se comprueban cifras de cartas (las evoluciones y la fusion cambian las reglas), solo la armadura de cada jefe.
# Aparta rogue.toml para empezar sin partida. Teclas: Space = A (elegir la del medio / continuar).
env = ["DBZ3_HUB_MODE=5", "DBZ3_TEST_RINGOUT=1", "DBZ3_TEST_ROGUE=15", "DBZ3_TEST_MODO=rogue,0", "REX_DBZ3_LANGUAGE=5"]
apartar = ["user_data/dbz3/rogue.toml*"]
