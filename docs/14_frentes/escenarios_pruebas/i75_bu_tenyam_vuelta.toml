pasos = ["log \"tag: empieza un combate\" 90", "esperar_pelea 120", "log \"absorbe BU TENYAM\" 120", "captura 01_absorbido", "log \"Bu vuelve a la forma 0\" 90", "log \"Bu sale de la forma absorbida\" 20", "log \"banco olvidado\" 20", "esperar 3000", "captura 02_vuelta", "esperar 30000", "captura 03_sigue", "esperar 30000", "captura 04_sigue"]
