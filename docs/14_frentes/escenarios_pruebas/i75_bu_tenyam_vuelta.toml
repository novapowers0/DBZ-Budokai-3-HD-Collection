descripcion = "#75: Super Bu absorbe a TENYAM (nova_bu_tenyam en smoke_f), a los 5 s vuelve a su forma (DBZ3_TEST_BU_VUELTA=2 hace lo que la orden de guion de la vuelta: suelta la ranura B y baja a la forma 0) y sigue 60 s pegando sin cerrarse; el log debe decir que recupera sus voces y que el banco por forma se suelta. A/B con --env DBZ3_TEST_SIN_GUARDAS=1 (sin el arreglo: banco y voces del absorbido se quedan). Con las capsulas devueltas (kDevolverCapsulas en fusion.cpp) la segunda absorcion cerraba el juego: 20261112-154831"
