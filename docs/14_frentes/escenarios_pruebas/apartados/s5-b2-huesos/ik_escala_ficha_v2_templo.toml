# S5 / B2-19 + B2F: IK de suelo de B2, lado B del A/B (escala por ficha encendida).
# El IK vive en la escena B2 (B2MotorHD::Paso): hay que armarla con DBZ3_TEST_ESCENA_VOLCADO=1 y
# DBZ3_TEST_B2_MOTOR=1. Combate nativo en el alta 25 = 'TEMPLO DE KAMI' (mod Templo de Kami, entrada 5002): plataforma
# cerrada; con el rival quieto, W acerca y L+P lo lanza contra el borde/pared.
# El lado A (tabla pie/mano con FICHA=0) es ik.toml.
# criterio = "dbz3 B2 HD: inicio por colision real" + "dbz3 B2 IK suelo: actor=... cabeza=... extremidades=...".
# log      = "dbz3 B2 HD: inicio por colision real" / "dbz3 B2 IK suelo:"
# PAREJAS (29 de la rueda): lote completo con `python tools/b2_huesos.py parejas` (arnes solb2x_lanzamiento).
descripcion = "B2 IK de suelo, lado B del A/B (dbz3_b2_ik_escala_ficha=1) en el Templo de Kami B2"
env = [
  "DBZ3_TEST_BATTLE=0,0,25",
  "DBZ3_TEST_CFG=dbz3_b2_ik_escala_ficha=true",
  "DBZ3_TEST_ESCENA_VOLCADO=1",
  "DBZ3_TEST_B2_MOTOR=1",
  "DBZ3_COMBATE_MUNECO=quieto",
  'DBZ3_PS2_GAMES=D:\DBZ3HD\ps2_games',
]
