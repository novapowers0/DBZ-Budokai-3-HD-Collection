descripcion = "modos_rogue_kumite (ROG-05): camino Kumite: todos jefes (Freezer, Cell, Cooler de la escalera del Kumite) con las reglas de los jefes del Kumite de jefes (armadura 50/60 %, recibido 150/175 %), aviso de jefe entre combates; final con 3 pisos y 150 + 900 + 1200 Zenie"
