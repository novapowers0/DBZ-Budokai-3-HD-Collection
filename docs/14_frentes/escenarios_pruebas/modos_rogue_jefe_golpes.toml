descripcion = "modos_rogue_jefe_golpes (ROG-01): Dragon Rogue, jefe en cada combate (DBZ3_TEST_ROGUE_JEFE=1): el jugador lo lleva el ordenador (DBZ3_COMBATE_LADOS=2) y golpea de verdad al jefe 1 (Broly, armadura 50 %, ventana 10 s) y al 2 (gigante, 60 %, ventana 8 s): el registro debe tener golpes con armadura y golpes sin armadura en el hueco de 3 s; el aviso sale como siempre"
# El aviso de ring out llega a los 12 s (DBZ3_TEST_RINGOUT_S, tagteam.cpp): hueco de 3 s = de 7 a 10 s (jefe 1) y de 5 a 8 s (jefe 2).
# Aparta rogue.toml para empezar sin partida; la oferta tras el jefe 1 sale de ROGUE_JEFE=1 python tools/rogue_oferta.py (Space = la del medio).
# Teclas: Space = A, Backspace = B (guardar y salir).
env = ["DBZ3_HUB_MODE=5", "DBZ3_TEST_RINGOUT=1", "DBZ3_TEST_RINGOUT_S=12", "DBZ3_COMBATE_LADOS=2", "DBZ3_TEST_ROGUE=3", "DBZ3_TEST_ROGUE_JEFE=1", "DBZ3_TEST_MODO=rogue,0", "REX_DBZ3_LANGUAGE=5"]
apartar = ["user_data/dbz3/rogue.toml*"]
