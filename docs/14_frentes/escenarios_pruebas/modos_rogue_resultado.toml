descripcion = "modos_rogue_resultado (ROG-06): Entrenamiento de Kami desde el selector (RB), compra de 2 ventajas con 6000 Zenie, partida de 3 pisos con jefe en el piso 2 (DBZ3_TEST_ROGUE_JEFE=2), 'ver mis mejoras' (Y) en el aviso de jefe, pantalla 05 con 1 jefe, 1250 Zenie y la carta de hito ki_17, y Kami desde el resultado (Y)."
