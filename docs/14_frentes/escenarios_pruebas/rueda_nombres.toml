descripcion = "16A: rueda del select completa. Con DBZ3_NAMES_DIAG=1 el log trae una linea 'dbz3 names: APLICA casilla N id ID alias A rotulo R -> entrada tbl[X] cambiada|SIN ROTULO (BuildImage=0)' por cada casilla; se avanza una casilla por tecla A (40 pasos) con una captura por casilla. Objetivo: saber QUE casillas salen con la barra vacia y cruzar con su anfitrion/alias y con el indice de textura del #AZT 2027 (datos/NOMBRES_RUEDA.md). Analisis: datos/analizar_rueda.py <dbz3.log>. La navegacion es la del frente 11 (probada); si el cursor no arranca en la casilla 0, la primera captura lo dice."
env = ["DBZ3_NAMES_DIAG=1"]
