  "DBZ3_TEST_HEROE_ABRIR=2",
  "DBZ3_TEST_HEROE_FINAL=1",
  "DBZ3_TEST_HEROE_ESFERAS=127",
  "DBZ3_TEST_DU_HEROE_FORZAR=1",
  "DBZ3_CAC_XV2=0",
  "DBZ3_TEST_CFG=dbz3_heroe_importar=true",
]
