# S8 / HER01 + HER02 + HER05: importar una receta desde el creador y llegar al final de la historia (Shenron).
# FASE 3: lo deja escrito el carril S8; lo ejecuta Z una sola vez.
#   python tools\pruebas.py correr smoke_a "docs\14_frentes\escenarios_pruebas\final\s8-heroe\heroe.toml"
#
# clave    = HER01 (boton/ruta Importar), HER02 (tecnicas de otro donante declaradas), HER05 (final real)
# cvar     = dbz3_heroe_importar=true (NUEVA, APAGADA de serie; src/heroe_ui.cpp). El resto son ganchos de prueba ya
#            existentes (DBZ3_TEST_HEROE_ABRIR=2, DBZ3_TEST_HEROE_FINAL, DBZ3_TEST_HEROE_ESFERAS=127).
# criterio = (1) Exportar crea mods/heroe_<nombre>/receta.toml; (2) Importar la lista y rehace el mod sin ERROR
#            (importar.json estado ok; en el registro "importar receta: ok"); (3) Empezar lleva al final (escena 1.39),
#            Shenron comprueba la mascara 7F y guarda deseos=1 (registro); creditos sin cierre.
# log      = "dbz3 heroe: exportar como personaje: ok (mod heroe_" / "dbz3 heroe: importar receta: ok (mod heroe_" /
#            "escena 102 entrada 35" / "se lanza la escena 1 entrada 39" / "dbz3 shenron: sub_8215C1B0"
#
# Banco sin juego (ya en verde): "mod center hd/cac/heroe_banco.py" ida-vuelta (base/ssj1-3 4/4 identicos) y
# textos (27 combates, 7/7 Esferas). PENDIENTE_JUEGO: las fotos del picker, del final y de los creditos HD.
