# C2 / HER09: heroe creado con piezas de Xenoverse 2 (razas y proporciones medidas). FASE 3; lo ejecuta Z.
#   python tools\pruebas.py correr smoke_c "docs\14_frentes\escenarios_pruebas\final\c2-xv2\xv2.toml"
#
# clave    = HER09 (proporciones/razas, fisica del heroe, boca y Piccolo Red Ribbon)
# cvar     = dbz3_cac_xv2=true (ya existe; APAGADA por defecto). Sin cvar nueva.
#            El banco offline (cac/xv2_razas.json) mide HUM/NMC/MAM; las demas caen al heroe base de B3.
# criterio = abrir Create, cambiar pelo/cara/torso de XV2 (logs "XV2: Pelo/Cara/Torso = modelo"),
#            confirmar sin ningun ERROR y montar la vista de combate. Medida visual: capturas frente/lado
#            para SSIM de fase 3 (>=0,80 de silueta frente a la referencia offline).
# log      = "Create abierto", "XV2: Pelo|Hair = modelo", "XV2: Cara|Face = modelo", "XV2: Torso = modelo",
#            "Create: confirmar", "vista previa combate_" y CERO lineas "ERROR".
#            NO se espera "piezas Xenoverse 2": esa linea solo sale al CONMUTAR la opcion en el menu
#            (heroe.cpp case 10), no al abrir Create; por eso la version anterior fallaba.
#
# PENDIENTE_JUEGO: capturas reales frente/lado de HUM, NMC y MAM; fisica del obi en combate (XV5S 6 nodos)
#   y decision de licencia de Piccolo Red Ribbon (no se publica sin ella).
descripcion = "HER09: heroe con piezas XV2 (HUM), cambio de pelo/cara/torso y montaje sin errores"
env = [
  "DBZ3_CAC_XV2=1",
  "DBZ3_TEST_HEROE_RAZA=7",
  "DBZ3_TEST_CFG=dbz3_cac_xv2=true",
]
