# F8, B2-11 (fase final SOLO Z): rueda de la Nave con el encuadre medido en los datos de B2.
# clave = B2-11
# cvar  = dbz3_nave_rueda_datos=true (OFF de serie)
# criterio = 29/29 figuras con el encuadre de B2 (cabeza/aro dentro del umbral B2-03) y el aro de las caras
#            de B3 con el marco nativo (celda 96, radio interior 23,8, grosor 2,7); sin 0,93 en los extras.
