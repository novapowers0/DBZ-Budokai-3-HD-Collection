# Alta 22 en opus2 (11/11): la que trae transicion_b2.b2t; los 'B2 grupo N' comparten entrada sin recurso.
clave = "B2-16/B2B"
cvar = "dbz3_b2_transicion_base=true"
criterio = "Inicio por golpe P+K y contacto real, fotos30/120/300, mismo escenario y VM sin bloqueo. Comparacion visual robot/duracion sigue obligatoria."
log = "dbz3 B2 HD: inicio validado grupo=0 entrada=1"
descripcion = "F4 Base: robot, no cambio de zona; sin forzar el evento"
env = ["DBZ3_TEST_CFG=dbz3_b2_transicion_base=true;dbz3_b2_validar_inicio=true;dbz3_combate_prueba_muneco='quieto'", "DBZ3_TEST_BATTLE=0,0,22", "DBZ3_COMBATE_MUNECO=quieto", "DBZ3_COMBATE_LADOS=2", "DBZ3_TEST_B2_FOTOS=30,120,300", "DBZ3_TEST_B2_CONSULTA=1", "DBZ3_PS2_GAMES=D:/DBZ3HD/ps2_games"]
pasos = ["log 'muneco en el lado 1' 90", "b2_f4 0"]
# Sin DBZ3_TEST_B2_MOTOR: la activacion debe venir de su cvar aislada.
