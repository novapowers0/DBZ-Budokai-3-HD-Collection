# IW-M15 / IW01 / 0x7DD. Ronda3 F2: apartado tras FAIL; continuidad comprobada.
# PENDIENTE_JUEGO y de integracion/telemetria: hoy CPU original no equivale a captura original.
# Criterio: jugador quieto90s; jugador+CBC pasa a9; tiempos comparables con las nueve
# referencias a mismas condiciones/semillas/reloj y 0DIF de captura. No usar DistH<14.
# El marcador de captura de abajo es CONTRATO PENDIENTE, no log ya implementado.
# F3/Z deben emitirlo desde la transicion original, nunca desde el criterio aproximado.
# Su ausencia debe FALLAR la prueba; ver CPU de Piccolo solamente no autoriza PASS.
descripcion = "7DD quieto90s: captura original y tiempo; bloqueado hasta integrar telemetria de jugador9"
env = [
  "DBZ3_TEST_IWMINI=0x7DD",
  "DBZ3_TEST_CFG=dbz3_iw_7dd_original=true;dbz3_iw_logica_original=true;dbz3_iw_campo_aislado=true",
  'DBZ3_PS2_GAMES=D:\DBZ3HD\ps2_games',
]
pasos = [
  'log "iwmini: prueba: empieza" 90',
  'log "dbz3 iwmips persecucion t=" 90',
  'log "dbz3 iwmips campo aislamiento=propio idx=14 dif=[0-9]+ completo=0" 1',
  'log "dbz3 iwmips persecucion t=120 ini=0 " 15',
  "captura 00_quieto",
  "esperar 90000",
  "captura 01_tras90s",
  'log "dbz3 iwmips captura7dd jugador=9 autoridad=original" 1',
  'log "dbz3 iwmini: prueba: resultado superado false" 120',
  "captura 02_resultado",
]
