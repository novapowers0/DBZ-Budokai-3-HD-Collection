# Frente a captura05 solo se anade la sonda de tareas, de solo lectura.
clave = "ONL03-R6-TAREAS"
cvar = "dbz3_net_tareas_sonda_f10=true"
descripcion = "F10 R6: contenido del nodo luchador+6832 en frontera y resimulacion"
criterio = "25 resumenes largos por lado sin diferencias, o FAIL con ambos estados y las tareas del primer tick distinto; no acredita arreglo"
env = [
  "DBZ3_TEST_CFG=dbz3_net_validacion_f10=true;dbz3_net_rollback=true;dbz3_net_cierre_sonda_f10=true;dbz3_net_tareas_sonda_f10=true;dbz3_diag_crashdump=true",
  "DBZ3_NET_AUTO=host", "DBZ3_NET_LOCAL=1", "DBZ3_NET_PORT=25498", "DBZ3_NET_JOIN_PORT=25498",
  "DBZ3_NET_SUMAS=1", "DBZ3_RB_SCRIPT=1", "DBZ3_RB_FIGHTS=25", "DBZ3_RB_TIME=60",
  "DBZ3_TEST_OCULTO=0", "DBZ3_TEST_TURBO=1",
  "DBZ3_RB_OUT=E:/DBZ3HD_trabajo/f10-online/ronda6_captura_06/datos",
  "DBZ3_RB_CSV=r6_tareas", "DBZ3_RB_DUMP=1", "DBZ3_RB_WLOG_DIFF=1",
]
pasos = [
  'log "dbz3 online: F10 ajustes efectivos: validacion true rollback true region US" 40',
  'log "dbz3 online: F10 sonda pre-cierre true" 20',
  'log "dbz3 rb: auto: combate pedido [(]ok[)]" 180',
  'log "dbz3 rb: F10 sonda tareas activa [(]solo lectura[)]" 180',
  'log "combate 25 de 25 terminado|F10 pre-cierre|F10: corte|UNREGISTERED|0x80000003|0xC0000005" 7200',
  'log "dbz3 rb: resumen del combate 25: .*sumas [0-9]+ / malas 0" 20',
  'captura f10_r6_tareas_fin',
]
