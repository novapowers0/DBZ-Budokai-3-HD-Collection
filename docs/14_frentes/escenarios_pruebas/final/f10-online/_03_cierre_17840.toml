# R6 captura02 conservada: corte F10 por suma distinta en 5710, sin alcanzar el cierre historico.
# Dos ejecuciones de paralelo --max 1, una por copia y rol; permiso expreso de dos ventanas.
# DBZ3_PRUEBAS_COPIAS=rb_a / rb_b; DBZ3_PRUEBAS_ENV=DBZ3_NET_AUTO=host / guest.
# PASS exige ambos logs; una sala sin rival no satisface el escenario.
clave = "ONL03-R6-PILA"
cvar = "dbz3_net_cierre_sonda_f10=true"
descripcion = "F10 R6: reproduccion larga por pareja con pila anterior a purecall/salida"
criterio = "25 combates por lado sin cierre; si cierra, conservar pila F10 y volcado, no presentarlo como PASS"
env = [
  "DBZ3_TEST_CFG=dbz3_net_validacion_f10=true;dbz3_net_rollback=true;dbz3_net_cierre_sonda_f10=true;dbz3_diag_crashdump=true",
  "DBZ3_NET_AUTO=host", "DBZ3_NET_LOCAL=1", "DBZ3_NET_PORT=25498", "DBZ3_NET_JOIN_PORT=25498",
  "DBZ3_NET_SUMAS=1", "DBZ3_RB_SCRIPT=1", "DBZ3_RB_FIGHTS=25", "DBZ3_RB_TIME=60",
  "DBZ3_TEST_OCULTO=0", "DBZ3_TEST_TURBO=1",
]
pasos = [
  'log "dbz3 online: F10 sonda pre-cierre true" 40',
  'log "dbz3 rb: auto: combate pedido [(]ok[)]" 180',
  'log "combate 25 de 25 terminado" 7200',
  'log "dbz3 rb: resumen del combate 25: .*sumas [0-9]+ / malas 0" 20',
  'captura f10_r6_fin',
]
