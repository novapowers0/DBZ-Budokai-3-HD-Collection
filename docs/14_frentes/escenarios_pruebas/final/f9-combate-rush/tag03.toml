# F9 / TAG03 — especiales E+dirección de los mods con formas_donante dentro de un relevo Tag Team.
# FASE 3: lo deja escrito F9; lo ejecuta Z una sola vez.
#   python tools\pruebas.py correr smoke_a "docs\14_frentes\escenarios_pruebas\final\f9-combate-rush\tag03.toml"
#
# clave    = TAG03 (4 mods: Goku GT 24, Vegeta GT 25, Vegeta Saiyán 31 y Goku Black 44 en la copia; aquí los dos primeros)
# cvar     = ninguna nueva: la ruta es la nativa de roster_ext.cpp (formas_donante ya en el _roster de los 4)
# criterio = E+dirección (Quote + W/A/S/D) sale con el especial propio en base, en una forma (P+K+G) y después de
#            un relevo automático, en los dos modos de la pareja; sin ERROR ni cierre. Fotos 01-04.
# log      = "tag: empieza un combate", "relevo .* -> " (sin ERROR); no hay línea propia de E+dirección
#
# PENDIENTE_JUEGO: la copia necesita los 4 mods instalados (imp_iw_goku_gt, imp_iw_vegeta_gt,
# vis_iw_vegeta_saiyan y vis_sdbh_goku_black) montados en el _roster. Los ids son los que les da
# roster_build en la copia (24/25/31/44 tras instalarlos en smoke_a el 10/11).
