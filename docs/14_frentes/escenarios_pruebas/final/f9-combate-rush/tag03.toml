  "DBZ3_TAG_TEST_PICKS=1",
  "DBZ3_TAG_TEST=24,25",
  "DBZ3_TAG_TEST2=7,10",
  "DBZ3_TAG_AUTOSWAP=120",
  "DBZ3_TEST_CFG=dbz3_combate_prueba_muneco=\"quieto\"",
]
