# S1 / IW 0x7DA (NB012): logica ORIGINAL + efectos de acierto/fallo del original (IW-F02).
# Se corre con:
#   python tools\pruebas.py correr <copia> "docs\14_frentes\escenarios_pruebas\final\s1_7da.toml"
#
# clave    = IW-F02 / 0x7DA
# cvar     = dbz3_iw_7da_original=true y dbz3_iw_efectos_original=true (las dos APAGADAS de serie)
# criterio = '#AMA 4/1 cargado'; lineas 'dbz3 iwfx 7DA campo=N obj=.. anim=.. inicio/fin' (cruz 7, salida 0x0C,
#            GREAT/GOOD/NORMAL 0x12-0x14, destello 0x2A); el piloto 'fallos' falla una tecla en la ronda 2 (cruz).
descripcion = "7DA (NB012) original con los efectos de acierto/fallo desde la UI del invitado"
env = [
  "DBZ3_TEST_IWMINI=0x7DA,auto,fallos",
  "DBZ3_TEST_QTE_LOG=1",
  "DBZ3_TEST_CFG=dbz3_iw_7da_original=true;dbz3_iw_efectos_original=true",
  'DBZ3_PS2_GAMES=D:\DBZ3HD\ps2_games',
]
pasos = [
  "log \"iwmini: prueba: empieza\" 90",
  "log \"dbz3 iwfx: #AMA 4/1\" 60",
  "log \"r14: en juego\" 90",
  "log \"dbz3 iwfx 7DA campo=\" 120",
  "esperar 2500",
  "captura a_efecto",
  "log \"anim=7 inicio\" 240",
  "esperar 300",
  "captura b_cruz",
  "log \"r14: fin\" 600",
]
