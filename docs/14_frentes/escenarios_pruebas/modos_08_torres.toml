descripcion = "MODOS-08: torres entero (DBZ3_TEST_MODO, sin HUB) hasta el premio final de 600 Zenie; Space entre pantallas"
env = ["DBZ3_HUB_MODE=5", "DBZ3_TEST_RINGOUT=1", "DBZ3_TEST_MODO=torres,0"]
